<body>
<header class="site-header"><a class="brand" href="../index.html" aria-label="Bubba Hub home"><img class="brand-logo" src="../images/logos/mainlogo-20260924-221429-7e305d.jpg" alt="Bubba Hub"></a><nav class="main-nav" aria-label="Main navigation"><a href="../directory.html">Find activities</a><a href="../planner.html">My planner</a><a href="../calendar.html">Calendar</a><a href="../my-hub.html">My Hub</a><a href="../leader.html">For class leaders</a><a class="active" href="../admin.html">Admin</a></nav><a class="button button-soft" href="../account.html">My account</a></header>
