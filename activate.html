<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate your Bubba Hub account</title><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/bold-theme.css"></head><body><main class="app-shell" style="max-width:620px;margin:40px auto;padding:20px"><section class="card"><h1>Welcome to Bubba Hub</h1><p id="status">Create your organiser credentials to activate your account.</p><form id="activateForm"><label for="secret">Choose your credentials</label><input id="secret" type="password" minlength="8" required autocomplete="new-password"><label for="confirm">Confirm</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Activate my account</button></form><p id="message" role="alert"></p></section></main><script>
const token=new URLSearchParams(location.search).get('token')||'',statusEl=document.getElementById('status'),message=document.getElementById('message'),form=document.getElementById('activateForm');
if(!token){form.hidden=true;statusEl.textContent='This activation link is missing its secure token.';}
else fetch('api/activate.php?token='+encodeURIComponent(token),{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(!d.ok){form.hidden=true;statusEl.textContent=d.message||'This activation link is invalid or expired.';}else statusEl.textContent='Account: '+d.email;}).catch(()=>{form.hidden=true;statusEl.textContent='We could not check this activation link.';});
form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('secret').value,b=document.getElementById('confirm').value;if(a.length<8||a!==b){message.textContent='Please enter matching credentials of at least 8 characters.';return;}const r=await fetch('api/activate.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token,new_secret:a,confirm:b})}),d=await r.json();if(!d.ok){message.textContent=d.message||'Activation failed. Please try again.';return;}location.href=d.redirect||'leader-portal.html';});
</script></body></html>
