<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to Bubba Hub</title><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="/assets/css/subpages-v2.css"></head><body class="bh-subpage-v2"><main class="app-shell" style="max-width:620px;margin:40px auto;padding:20px"><section class="card" style="padding:28px"><div style="text-align:center;margin-bottom:22px"><img src="/wp-content/uploads/logo/logoheader.png" alt="Bubba Hub" style="width:190px;max-width:100%;height:auto"></div><h1 style="color:#416651">Welcome to Bubba Hub 💚</h1><p id="status">Enter your one-time sign-in code, then create your password.</p><form id="activateForm"><label for="code">One-time sign-in code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><label for="password">Create your password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label for="confirm">Confirm your password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Create password &amp; activate account</button></form><p id="message" role="alert"></p></section></main><script>
const token=new URLSearchParams(location.search).get('token')||'',statusEl=document.getElementById('status'),message=document.getElementById('message'),form=document.getElementById('activateForm');
if(!token){form.hidden=true;statusEl.textContent='This activation link is missing its secure token.';}else fetch('api/activate.php?token='+encodeURIComponent(token),{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(!d.ok){form.hidden=true;statusEl.textContent=d.message||'This activation link is invalid or expired.';}else statusEl.textContent='Account: '+d.email;}).catch(()=>{form.hidden=true;statusEl.textContent='We could not check this activation link.';});
form.addEventListener('submit',async e=>{e.preventDefault();const code=document.getElementById('code').value.replace(/\D/g,''),a=document.getElementById('password').value,b=document.getElementById('confirm').value;if(!/^\d{6}$/.test(code)||a.length<8||a!==b){message.textContent='Enter the 6-digit code and matching passwords of at least 8 characters.';return;}const r=await fetch('api/activate.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token,code,password:a,confirm_password:b})}),d=await r.json();if(!d.ok){message.textContent=d.message||'Activation failed. Please check your code and try again.';return;}location.href=d.redirect||'leader-portal.html';});
</script></body></html>
