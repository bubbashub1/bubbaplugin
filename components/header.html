<header class="bh-site-header">
  <div class="bh-header-inner">
    <div class="bh-header-top-row">
      <a href="index.html" class="bh-header-logo" aria-label="Bubba Hub home">
        <img src="images/logos/gemini_generated_image_pq5i56pq5i56pq5i-removebg-preview-20260930-190428-b9e652.png" alt="Bubba Hub Logo">
      </a>

      <div class="bh-header-actions">
        <nav class="bh-main-nav" id="bh-main-nav" aria-label="Main menu">
          <a href="directory.html">Find activities</a>
          <a href="my-hub.html">My Hub</a>
          <a href="help-support.html">Support &amp; Guidance</a>
          <a href="leader.html">Class Leaders</a>
          <a href="account.html">My Account</a>
        </nav>

        <button type="button"
                class="bh-header-search-toggle"
                aria-expanded="false"
                aria-controls="bh-header-search-bar"
                aria-label="Open search">
          <span aria-hidden="true">⌕</span>
        </button>

        <a href="auth.html" class="bh-sign-in-btn">Sign in</a>
      </div>
    </div>

    <form action="directory.html" method="get" class="bh-header-search-bar" id="bh-header-search-bar" role="search" aria-label="Search family activities">
      <div class="bh-header-search-fields">
        <input type="search" name="keyword" placeholder="Keyword" aria-label="Keyword">
        <select name="region" aria-label="Region">
          <option value="">Region</option>
        </select>
        <select name="town" aria-label="Town">
          <option value="">Town</option>
        </select>
        <select name="category" aria-label="Category">
          <option value="">Category</option>
        </select>
        <select name="day" aria-label="Day">
          <option value="">Day</option>
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
          <option value="Saturday">Saturday</option>
          <option value="Sunday">Sunday</option>
        </select>
        <button type="submit" class="bh-header-search-submit">Search</button>
      </div>
    </form>
  </div>
</header>

<script>
(function () {
  const toggle = document.querySelector('.bh-header-search-toggle');
  const searchBar = document.getElementById('bh-header-search-bar');

  if (!toggle || !searchBar) return;

  toggle.addEventListener('click', function () {
    const isOpen = searchBar.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(isOpen));
    toggle.setAttribute('aria-label', isOpen ? 'Close search' : 'Open search');

    if (isOpen) {
      const input = searchBar.querySelector('input[name="keyword"]');
      if (input) setTimeout(() => input.focus(), 150);
    }
  });
})();
</script>
