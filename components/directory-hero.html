<section class="directory-hero-fullwidth" data-bh-directory-hero>
  <form class="home-search directory-hero-search" data-bh-hero-form method="get">
    <h2>Find family activities</h2>
    <div class="home-search-fields directory-hero-search-fields">
      <label><span>⌕</span><input data-bh-hero-field="keyword" name="keyword" type="search" placeholder="Keyword" aria-label="Keyword"></label>
      <label><span>⌖</span><select data-bh-hero-field="region" name="region"><option value="">Region</option></select></label>
      <label><span>⌖</span><select data-bh-hero-field="town" name="town"><option value="">Town</option></select></label>
      <label><span>♟</span><select data-bh-hero-field="category" name="category"><option value="">Category</option></select></label>
      <label><span>◷</span><select data-bh-hero-field="day" name="day"><option value="">Day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label>
      <button class="button button-primary" type="submit">Search</button>
    </div>
    <div class="directory-hero-actions">
      <button type="button" class="home-advanced-link directory-search-advanced-link" data-bh-hero-filters>More filters →</button>
      <a class="button button-soft directory-calendar-hero-button" href="calendar.html">View calendar →</a>
      <a class="button directory-map-action-button directory-mobile-map-link" href="map.html">View activities on map →</a>
      <a class="button directory-planner-action-button" href="planner.html">View My Planner →</a>
    </div>
    <div class="directory-popular" aria-label="Popular categories">
      <span class="directory-popular-label">Popular:</span>
      <button type="button" class="directory-popular-chip" data-category="Baby classes">🍼 Baby classes</button>
      <button type="button" class="directory-popular-chip" data-category="Toddler groups">👣 Toddler groups</button>
      <button type="button" class="directory-popular-chip" data-category="Music &amp; movement">🎵 Music &amp; movement</button>
      <button type="button" class="directory-popular-chip" data-category="Swimming">🏊 Swimming</button>
      <button type="button" class="directory-popular-chip" data-category="Soft play">🧸 Soft play</button>
      <button type="button" class="directory-popular-chip" data-category="Family activities">👨‍👩‍👧 Family activities</button>
    </div>
  </form>
</section>
