<section class="directory-hero-fullwidth" data-bh-directory-hero>
  <form class="home-search directory-hero-search" data-bh-hero-form method="get">
    <h2>Find family activities</h2>
    <div class="home-search-fields directory-hero-search-fields">
      <label><span>⌕</span><input data-bh-hero-field="keyword" name="keyword" type="search" placeholder="Keyword" aria-label="Keyword"></label>
      <label><span>⌖</span><select data-bh-hero-field="region" name="region"><option value="">Region</option></select></label>
      <label><span>⌖</span><select data-bh-hero-field="town" name="town"><option value="">Town</option></select></label>
      <label><span>♟</span><select data-bh-hero-field="category" name="category"><option value="">Category</option></select></label>
      <label><span>◷</span><select data-bh-hero-field="day" name="day"><option value="">Day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label>
      <label><span>⌖</span><input id="bhPostcodeInput" name="postcode" autocomplete="postal-code" placeholder="Postcode (e.g. EX1 1AA)" aria-label="Postcode" inputmode="text"></label><label><span>↔</span><select id="bhPostcodeRadius" name="radius" aria-label="Search radius"><option value="5">5 miles</option><option value="10" selected>10 miles</option><option value="25">25 miles</option><option value="50">50 miles</option><option value="100">100 miles</option></select></label><button class="button button-primary" type="submit">Search</button><button type="button" class="button button-soft" id="bhUseMyLocation">⌖ Use my location</button><button type="button" class="button button-soft" id="bhPostcodeClear">Clear location</button><span id="bhPostcodeStatus" role="status" aria-live="polite"></span>
    </div>
    <div class="directory-hero-actions">
      <button type="button" class="home-advanced-link directory-search-advanced-link" data-bh-hero-filters>More search options →</button>
    </div>
    <section class="directory-more-filters directory-hero-expanded-filters" id="directoryFilters" aria-label="More search filters"><div data-bh-advanced-filters-placeholder></div></section>
    <div class="directory-popular" aria-label="Popular categories" data-bh-popular-categories>
      <span class="directory-popular-label">Popular:</span>
      <span class="directory-popular-loading" aria-live="polite">Loading…</span>
    </div>
  </form>

</section>
