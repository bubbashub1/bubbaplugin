<div class="bh-advanced-filters" data-bh-advanced-filters>
<button type="button" class="directory-more-search-toggle" id="advancedToggle" aria-expanded="false" aria-controls="advancedFields">More search filters <span aria-hidden="true">＋</span></button>
<div class="directory-more-search-panel" id="advancedFields" hidden>
<div class="directory-filter-fields">
<div class="directory-advanced-filter-field" data-filter-key="category"><label class="directory-filter-label" for="category">Category</label><select class="filter-input" id="category"><option value="">All categories</option></select></div>
<div class="directory-advanced-filter-field" data-filter-key="region"><label class="directory-filter-label" for="area">Region</label><select class="filter-input" id="area"><option value="">All regions</option></select></div>
<div class="directory-advanced-filter-field" data-filter-key="town"><label class="directory-filter-label" for="town">Town</label><select class="filter-input" id="town"><option value="">All towns</option></select></div>
<label class="filter-free directory-advanced-filter-field" data-filter-key="free"><input type="checkbox" id="free"> Free only</label>
<div class="directory-advanced-section">
<div class="directory-nearby-control directory-advanced-filter-field" data-filter-key="nearby"><label>Nearby</label><button type="button" class="button button-soft directory-nearby-button" id="useHomeLocation">📍 Use my home</button><span id="nearbyStatus" class="directory-nearby-status" aria-live="polite"></span></div>
<div class="directory-advanced-filter-field" data-filter-key="age"><label class="directory-filter-label" for="ageRange">Age</label><select class="filter-input" id="ageRange"><option value="">Any age</option><option value="baby">Baby · 0–1</option><option value="toddler">Toddler · 1–3</option><option value="preschool">Preschool · 3–5</option><option value="school">School age · 5–9</option></select><input id="ageMin" type="hidden" value="0"><input id="ageMax" type="hidden" value="9"></div>
<div class="directory-advanced-filter-field" data-filter-key="day"><label class="directory-filter-label" for="day">Day</label><select class="filter-input" id="day"><option value="">Any day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></div>
<div class="directory-advanced-filter-field" data-filter-key="price"><label class="directory-filter-label" for="maxPrice">Price</label><select class="filter-input" id="maxPrice"><option value="">Any price</option><option value="0">Free</option><option value="5">Up to £5</option><option value="10">Up to £10</option><option value="15">Up to £15</option><option value="20">Up to £20</option><option value="30">Up to £30</option><option value="over30">Over £30</option></select></div>
<div class="directory-advanced-filter-field" data-filter-key="session_length"><label class="directory-filter-label" for="sessionLength">Session length</label><select class="filter-input" id="sessionLength"><option value="">Any length</option><option value="60">Up to 1 hour</option><option value="120">1–2 hours</option><option value="180">2–3 hours</option><option value="181">3+ hours</option></select></div>
<div class="directory-advanced-filter-field" data-filter-key="sen"><label class="directory-filter-label" for="sen">SEN friendly</label><select class="filter-input" id="sen"><option value="">Any</option><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="directory-advanced-filter-field" data-filter-key="term_time"><label class="directory-filter-label" for="termTime">Term time</label><select class="filter-input" id="termTime"><option value="">Any</option><option value="yes">Term time only</option><option value="no">Not term time only</option></select></div>
<label class="filter-free directory-advanced-filter-field" data-filter-key="booking"><input type="checkbox" id="bookingRequired"> Booking required / bookable online</label>
<fieldset class="directory-advanced-filter-field directory-accessibility-fieldset" data-filter-key="accessibility"><legend class="directory-filter-label">Accessibility</legend><details class="directory-accessibility-expand"><summary>Expand accessibility options</summary><div class="directory-accessibility-options"><label class="filter-check"><input type="checkbox" class="accessibility-option" value="step-free"> <span>Step-free access</span></label><label class="filter-check"><input type="checkbox" class="accessibility-option" value="accessible-toilet"> <span>Accessible toilet</span></label><label class="filter-check"><input type="checkbox" class="accessibility-option" value="baby-changing"> <span>Baby changing</span></label><label class="filter-check"><input type="checkbox" class="accessibility-option" value="parking"> <span>Accessible parking</span></label><label class="filter-check"><input type="checkbox" class="accessibility-option" value="wheelchair"> <span>Wheelchair friendly</span></label><label class="filter-check"><input type="checkbox" class="accessibility-option" value="sensory-friendly"> <span>Sensory-friendly</span></label><label class="filter-check"><input type="checkbox" class="accessibility-option" value="hearing-support"> <span>Hearing support</span></label><label class="filter-check"><input type="checkbox" class="accessibility-option" value="visual-support"> <span>Visual support</span></label></div></details></fieldset>
</div>
<div class="directory-filter-actions"><button class="button button-primary" id="applyFilters" type="button">Apply filters</button><button class="button button-soft directory-clear" id="clear" type="button">Clear filters</button></div>
</div>
</div>
