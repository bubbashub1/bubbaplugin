<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Messages · Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/portal-v2.css"><style>.inbox{max-width:1050px;margin:auto;padding:25px 18px 65px}.inbox h1{color:#144400;font-size:clamp(2rem,4vw,3rem)}.inbox .message{background:white;border:1px solid #d8e6db;border-radius:20px;padding:24px;margin:15px 0}.inbox .meta{color:#617261;font-size:.9rem}.inbox .message-body{white-space:pre-wrap}.inbox textarea{display:block;width:100%;min-height:95px;padding:12px;border:1px solid #9fb7a5;border-radius:12px;margin:12px 0}.inbox .response{background:#e9f3ec;padding:14px;border-radius:12px;white-space:pre-wrap}</style></head><body class="bh-leader-v2"><header class="site-header">

</header><main class="inbox"><a href="/leader/">← Leader dashboard</a><h1>My Messages</h1><p>Help requests and booking enquiries from families. Replies are saved here and a copy is emailed to the family.</p><div id="messages" aria-live="polite">Loading messages…</div></main><script>
const root=document.getElementById('messages');async function load(){try{const r=await fetch('/api/leader-messages.php',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Unable to load messages');root.replaceChildren();if(!d.messages.length){root.textContent='No messages yet. New enquiries will appear here.';return;}for(const m of d.messages){const card=document.createElement('article');card.className='message';const title=document.createElement('h2');title.textContent=m.subject;const meta=document.createElement('p');meta.className='meta';meta.textContent=(m.category==='booking'?'Booking enquiry':'Help request')+' · '+m.sender_email+' · '+m.created_at;const body=document.createElement('p');body.className='message-body';body.textContent=m.body;card.append(title,meta,body);if(m.reply){const reply=document.createElement('p');reply.className='response';reply.textContent='Your reply: '+m.reply;card.append(reply);}const form=document.createElement('form'),field=document.createElement('textarea'),button=document.createElement('button'),status=document.createElement('p');field.required=true;field.maxLength=5000;field.placeholder='Write a reply to the family…';button.className='button button-primary';button.textContent=m.reply?'Update reply':'Send reply';form.append(field,button,status);form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;try{const res=await fetch('/api/leader-messages.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reply',id:m.id,reply:field.value})});const out=await res.json();if(!res.ok||!out.ok)throw Error(out.message||'Unable to send reply');await load();}catch(err){status.textContent=err.message;button.disabled=false}});card.append(form);root.append(card)}}catch(e){root.textContent=e.message}}load();
</script></body></html>
