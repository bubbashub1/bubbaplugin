<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Messages · Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/portal-v2.css"><style>
body.bh-leader-v2{background:#f6faf7;color:#144400;min-height:100vh}
.inbox{width:min(1240px,100%);max-width:none;margin:0 auto;padding:clamp(20px,3vw,42px) 16px 85px}
.inbox-hero{background:linear-gradient(115deg,#d8e6db,#edf5ed 65%,#dceef0);border:1px solid #d5e4d8;border-radius:28px;padding:clamp(25px,4vw,48px);margin-bottom:24px}
.inbox .back-link{color:#416651;text-decoration:none;font-weight:750;display:inline-flex;align-items:center;margin-bottom:18px}
.inbox h1{color:#144400;font-size:clamp(2.15rem,4.5vw,3.4rem);line-height:1.1;letter-spacing:-.04em;margin:0 0 12px;font-weight:900}
.inbox .intro{color:#416651;max-width:650px;font-size:1.05rem;line-height:1.6;margin:0}
.inbox .eyebrow{color:#3c8e96;text-transform:uppercase;letter-spacing:.11em;font-size:.8rem;font-weight:900;margin:0 0 10px}
.inbox .message-list{display:grid;gap:16px}
.inbox .empty-state{background:#fff;border:1px solid #d8e6db;border-radius:24px;padding:clamp(35px,6vw,75px) 22px;text-align:center;box-shadow:0 12px 30px rgba(20,68,0,.035)}
.inbox .empty-icon{display:grid;place-items:center;background:#d8e6db;width:72px;height:72px;border-radius:23px;margin:0 auto 20px;font-size:2rem}
.inbox .empty-state h2{font-size:clamp(1.4rem,3vw,1.8rem);margin:0 0 10px;color:#144400}
.inbox .empty-state p{color:#617261;margin:0 auto 20px;max-width:470px;line-height:1.6}
.inbox .empty-state a{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:999px;background:#144400;color:#fff;text-decoration:none;font-weight:800}
.inbox .message{background:white;border:1px solid #d8e6db;border-radius:22px;padding:clamp(20px,3vw,30px);margin:0;box-shadow:0 8px 22px rgba(20,68,0,.04)}
.inbox .message h2{margin:0 0 8px;color:#144400;font-size:1.4rem}
.inbox .meta{color:#617261;font-size:.9rem;line-height:1.5}
.inbox .message-body{white-space:pre-wrap;line-height:1.65;color:#284b34}
.inbox textarea{display:block;width:100%;min-height:110px;padding:14px;border:1px solid #9fb7a5;border-radius:14px;margin:14px 0;background:#fcfefd;font:inherit;box-sizing:border-box}
.inbox textarea:focus{outline:3px solid #9cb8a4;outline-offset:2px}
.inbox .response{background:#e9f3ec;padding:16px;border-radius:14px;white-space:pre-wrap}
.inbox .button-primary{background:#144400;color:#fff;border-radius:999px;padding:12px 23px}
@media(max-width:600px){.inbox{padding:16px 14px 55px}.inbox-hero{border-radius:20px;padding:26px 20px}.inbox .empty-state{border-radius:18px}}
</style></head><body class="bh-leader-v2"><header class="site-header">
  <a class="brand" href="/index.html" aria-label="Bubba Hub home"><img class="brand-logo" src="/wp-content/uploads/logo/logoheader.png" alt="Bubba Hub"></a>
  <nav class="main-nav" aria-label="Main menu">
    <a href="/directory.html">Find activities</a>
    <a href="/my-hub.html">My Hub</a>
    <a href="/help-support.html">Support &amp; Guidance</a>
    <a href="/leader.html">Class Leaders</a>
    <a href="/account.html">My Account</a>
  </nav>
  <a class="button button-soft" href="/account.html">My account</a>
</header><main class="inbox"><section class="inbox-hero"><a class="back-link" href="/leader/">← Leader dashboard</a><p class="eyebrow">Your leader inbox</p><h1>My Messages</h1><p class="intro">All your family enquiries in one place. Read help requests, manage booking questions and reply directly to families.</p></section><section id="messages" class="message-list" aria-label="Your messages" aria-live="polite">Loading messages…</section></main><script>
const root=document.getElementById('messages');async function load(){try{const r=await fetch('/api/leader-messages.php',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Unable to load messages');root.replaceChildren();if(!d.messages.length){root.innerHTML='<div class="empty-state"><span class="empty-icon" aria-hidden="true">✉️</span><h2>You’re all caught up!</h2><p>No messages yet. When a family sends a question or booking enquiry, you’ll find it here.</p><a href="/leader/">Back to leader dashboard →</a></div>';return;}for(const m of d.messages){const card=document.createElement('article');card.className='message';const title=document.createElement('h2');title.textContent=m.subject;const meta=document.createElement('p');meta.className='meta';meta.textContent=(m.category==='booking'?'Booking enquiry':'Help request')+' · '+m.sender_email+' · '+m.created_at;const body=document.createElement('p');body.className='message-body';body.textContent=m.body;card.append(title,meta,body);if(m.reply){const reply=document.createElement('p');reply.className='response';reply.textContent='Your reply: '+m.reply;card.append(reply);}const form=document.createElement('form'),field=document.createElement('textarea'),button=document.createElement('button'),status=document.createElement('p');field.required=true;field.maxLength=5000;field.placeholder='Write a reply to the family…';button.className='button button-primary';button.textContent=m.reply?'Update reply':'Send reply';form.append(field,button,status);form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;try{const res=await fetch('/api/leader-messages.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reply',id:m.id,reply:field.value})});const out=await res.json();if(!res.ok||!out.ok)throw Error(out.message||'Unable to send reply');await load();}catch(err){status.textContent=err.message;button.disabled=false}});card.append(form);root.append(card)}}catch(e){root.textContent=e.message}}load();
</script></body></html>
