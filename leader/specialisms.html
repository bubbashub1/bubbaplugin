<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Specialisms · Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/portal-v2.css"><style>.leader-workspace{max-width:1120px;margin:auto;padding:26px 18px 65px}.leader-workspace h1{color:#144400;font-size:clamp(2rem,4vw,3rem)}.leader-workspace .panel{background:white;border:1px solid #d8e6db;border-radius:22px;padding:24px;margin-top:18px}.leader-workspace .muted{color:#617261}.leader-workspace textarea{width:100%;min-height:105px;border:1px solid #9fb7a5;border-radius:12px;padding:12px}.leader-workspace .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.leader-workspace .topics label{padding:16px;border-radius:14px;background:#e9f2eb}.leader-workspace .message{border-top:1px solid #d8e6db;padding:18px 0}.leader-workspace .message:first-child{border:0}.leader-workspace .message p{white-space:pre-wrap}.leader-workspace .actions{display:flex;gap:12px;flex-wrap:wrap}</style></head><body class="bh-leader-v2"><header class="site-header">

</header><main class="leader-workspace"><a href="/leader/">← Leader dashboard</a><h1>My Specialisms</h1><p class="muted">Choose the areas where you can offer families guidance. You can change these at any time.</p><section class="panel"><form id="specialismsForm"><div id="topics" class="topics">Loading specialisms…</div><p id="status" role="status"></p><button class="button button-primary" type="submit">Save my specialisms</button></form></section></main><script>const form=document.getElementById('specialismsForm'),root=document.getElementById('topics'),status=document.getElementById('status');async function load(){try{const r=await fetch('/api/leader-portal.php',{credentials:'same-origin'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Could not load specialisms');root.replaceChildren();const selected=new Set(d.expertise||[]);for(const [key,name] of Object.entries(d.expertise_topics||{})){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name='expertise';input.value=key;input.checked=selected.has(key);label.append(input,' '+name);root.append(label)}}catch(e){root.textContent='';status.textContent=e.message}}form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Saving…';try{const topics=[...form.querySelectorAll('input:checked')].map(x=>x.value);const r=await fetch('/api/leader-portal.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save_expertise',topics})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Save failed');status.textContent='Your specialisms have been saved.'}catch(e){status.textContent=e.message}});load();</script></body></html>
