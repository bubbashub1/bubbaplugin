<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claim your listing | Bubba Hub</title><style>body{font:16px/1.5 system-ui;background:#f1f8f3;color:#193b2c;margin:0}main{max-width:640px;margin:8vh auto;background:white;border-radius:20px;padding:2rem;box-shadow:0 5px 25px #193b2c18}button{background:#166044;color:white;border:0;border-radius:12px;padding:1rem;cursor:pointer}button:disabled{opacity:.5}a{color:#166044}</style></head><body><main><p><a href="/">Bubba Hub South West</a></p><h1>Claim your free listing</h1><p>Confirm your invitation to request access to manage your activity. Bubba Hub will review your request before assigning ownership.</p><p id="status" role="status">Checking your Class Leader account…</p><button id="claim" disabled>Request listing access</button></main><script>
(async()=>{const qs=new URLSearchParams(location.search),id=Number(qs.get('activity_id')),invite=qs.get('invite')||'',status=document.getElementById('status'),button=document.getElementById('claim');const next=location.pathname+location.search;const signin='/auth.html?context=leader&next='+encodeURIComponent(next);
if(!Number.isSafeInteger(id)||id<1||!/^[a-f0-9]{64}$/.test(invite)){status.textContent='This invitation link is invalid. Please request a new one.';return;}
try{const r=await fetch('/api/auth.php?action=me',{credentials:'same-origin',cache:'no-store'}),j=await r.json();if(!j.leader_authenticated||j.user?.role!=='leader'){status.textContent='Please sign in with the Class Leader email address that received the invitation.';const a=document.createElement('a');a.href=signin;a.textContent=' Sign in as Class Leader';status.append(a);return;}if(!j.csrf)throw Error('Your session has expired. Please sign in again.');status.textContent='Signed in. Request access to this listing for admin review.';button.disabled=false;button.onclick=async()=>{button.disabled=true;status.textContent='Submitting your claim…';try{const response=await fetch('/api/claim-listing.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({activity_id:id,invite,csrf:j.csrf})}),data=await response.json();if(!response.ok||!data.ok)throw Error(data.message||'Unable to submit your claim.');status.textContent=data.message||'Your claim has been submitted for review.';history.replaceState(null,'','/claim-invitation.html');}catch(e){status.textContent=e.message;button.disabled=false;}};}catch(e){status.textContent='Unable to verify your account. Please try again later.';}})();
</script></body></html>
