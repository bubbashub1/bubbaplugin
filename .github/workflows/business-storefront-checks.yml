name: Businesses and leader storefront checks

on:
  pull_request:
    branches: [staging-site]
    paths:
      - 'api/directory-businesses.php'
      - 'api/auth.php'
      - 'api/lib/business-storefront.php'
      - 'api/admin-directory-businesses.php'
      - 'api/admin-directory-sectors.php'
      - 'api/admin-directory-review.php'
      - 'api/leader-directory-records.php'
      - 'api/leader-directory-manage.php'
      - 'api/directory-sector.php'
      - 'admin/admin-directory-sectors.html'
      - 'admin/admin-directory-businesses.html'
      - 'admin/admin-directory-businesses.html'
      - 'api/organiser-terms.php'
      - 'api/activities.php'
      - 'assets/js/directory-businesses.js'
      - 'assets/js/directory-sector.js'
      - 'businesses.html'
      - 'childcare-schools.html'
      - 'places-days-out.html'
      - 'school-clubs.html'
      - 'organiser.html'
      - '.github/workflows/business-storefront-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Check PHP syntax
        run: |
          set -eu
          php -l api/directory-businesses.php
          php -l api/auth.php
          php -l api/lib/business-storefront.php
          php -l api/admin-directory-businesses.php
          php -l api/admin-directory-sectors.php
          php -l api/admin-directory-review.php
          php -l api/leader-directory-records.php
          php -l api/leader-directory-manage.php
          php -l api/directory-sector.php
          php -l api/organiser-terms.php
          php -l api/activities.php

      - name: Check Businesses directory JavaScript
        run: |
          node --check assets/js/directory-businesses.js
          node --check assets/js/directory-sector.js

      - name: Check public organiser page inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = [] if not attrs.get("src") else None
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

          parser = InlineScripts()
          parser.feed(Path("organiser.html").read_text())
          source = "\n;\n".join(parser.scripts)
          assert source.strip(), "No inline organiser page scripts found"
          Path("/tmp/organiser-inline.js").write_text(source)
          print(f"Extracted {len(parser.scripts)} inline script block(s)")
          PY
          node --check /tmp/organiser-inline.js

      - name: Verify automatic storefront and empty-state safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          feed = Path("api/directory-businesses.php").read_text()
          page = Path("organiser.html").read_text()
          terms = Path("api/organiser-terms.php").read_text()
          checks = {
              "published linked Listings count": "linked_listing_count",
              "published storefront-only query": "FROM bh_directory_businesses b LEFT JOIN bh_organisers o",
              "legacy organiser email matching": "LOWER(u.email)=LOWER(o.email)",
          }
          for label, marker in checks.items():
              assert marker in feed, f"Missing {label}"
          assert "publicContent.organisation_name" in page, "Public organiser profile should load without activity records"
          assert "Their activities will appear here as soon as they are published" in page, "Missing no-activity storefront state"
          assert "'website'=>$row['website']" in terms and "'email'=>$row['email']" in terms, "Public organiser contact fields missing"
          helper = Path("api/lib/business-storefront.php").read_text()
          auth = Path("api/auth.php").read_text()
          admin_api = Path("api/admin-directory-businesses.php").read_text()
          admin_page = Path("admin/admin-directory-businesses.html").read_text()
          assert "bh_ensure_business_storefront" in auth and "bh_ensure_business_storefront" in helper, "Leader registration should create storefront records"
          assert "'status'=>'draft'" in helper, "Automatic storefronts must remain drafts"
          assert "create_missing_leader_storefronts" in admin_api and "create_missing_leader_storefronts" in admin_page, "Admin backfill action is not wired up"
          assert "already_had_storefront" in admin_api, "Backfill should report existing storefronts"
          print("Automatic leader storefront checks passed")
          business_page = Path("businesses.html").read_text()
          sector_client = Path("assets/js/directory-sector.js").read_text()
          assert 'data-sector="business"' in business_page and '/assets/js/directory-sector.js' in business_page, "Businesses page is not wired to the sector client"
          assert 'endpoint="/api/directory-businesses.php"' in sector_client, "Businesses page must use the dedicated storefront API"
          assert 'data.businesses' in sector_client and 'linked_listing_count' in sector_client, "Storefront response fields are not rendered"
          assert 'businessCategoriesLoaded' in sector_client, "Business category options should reflect published storefront categories"
          assert "b.postcode LIKE ?" in feed and "b.address LIKE ?" in feed, "Business keyword search should include postcode and address"
          assert "b.town LIKE ? OR b.postcode LIKE ?" in feed, "Town filter should support partial town/postcode matches"
          print("Public Businesses page and search wiring checks passed")
          for field in ("registration_body", "registration_reference", "verified_on", "facilities", "school_name", "age_min", "age_max", "days_times", "collection_arrangements", "price_details", "verification_url"):
              assert field in sector_client, f"Public sector card is missing {field}"
          for path, sector in (("childcare-schools.html", 'data-sector="childcare"'), ("places-days-out.html", 'data-sector="place"'), ("school-clubs.html", 'data-sector="school_club"')):
              page = Path(path).read_text()
              assert sector in page, f"{path} has the wrong sector key"
              assert '/assets/js/directory-sector.js' in page, f"{path} is missing its sector client"
              assert '/assets/js/directory-universal.js' not in page, f"{path} must not inject universal Activities results"
          assert "sectorDetails(x)" in sector_client, "Sector-specific public details are not rendered"
          print("Specialist directory card and separation checks passed")
          admin_business_api = Path("api/admin-directory-businesses.php").read_text()
          leader_records = Path("api/leader-directory-records.php").read_text()
          leader_manage = Path("api/leader-directory-manage.php").read_text()
          review_api = Path("api/admin-directory-review.php").read_text()
          sector_admin = Path("api/admin-directory-sectors.php").read_text()
          assert "upgrade_family_directory_workflow" in admin_business_api, "Missing safe Leader workflow schema upgrade"
          for field in ("organiser_id", "created_by_user_id", "submitted_at", "review_note", "holiday_provision", "registration_details", "bh_directory_record_reviews", "bh_directory_record_revisions"):
              assert field in admin_business_api, f"Schema upgrade is missing {field}"
          assert "status='pending'" in leader_records and "bh_directory_record_revisions" in leader_records, "Leader submission and revision lifecycle missing"
          assert "if(!$tableExists($table))continue" in leader_manage, "Leader workspace must skip uninstalled optional sections"
          assert "if(!$has($spec[0]))continue" in review_api, "Admin review must skip uninstalled optional sections"
          assert "age_min" in sector_admin and "holiday_provision" in sector_admin and "registration_details" in sector_admin, "Admin editor missing Leader-specific fields"
          print("Leader submission schema and moderation compatibility checks passed")
          PY
