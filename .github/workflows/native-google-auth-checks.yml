name: Native Google auth checks

on:
  pull_request:
    paths:
      - 'api/auth.php'
      - 'api/turnstile-config.php'
      - 'api/turnstile-settings.php'
      - 'api/admin-leader-actions.php'
      - 'api/admin-user-directory.php'
      - 'api/reservations.php'
      - 'assets/js/auth-page.js'
      - 'assets/js/admin-leader-directory.js'
      - 'auth.html'
      - '.github/workflows/native-google-auth-checks.yml'
  push:
    branches: [main]
    paths:
      - 'api/auth.php'
      - 'api/turnstile-config.php'
      - 'api/turnstile-settings.php'
      - 'api/admin-leader-actions.php'
      - 'api/admin-user-directory.php'
      - 'assets/js/auth-page.js'
      - 'assets/js/admin-leader-directory.js'
      - 'auth.html'
      - '.github/workflows/native-google-auth-checks.yml'

permissions:
  contents: read

jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Check native authentication PHP syntax
        run: |
          php -l api/auth.php
          php -l api/turnstile-config.php
          php -l api/admin-leader-actions.php
          php -l api/admin-user-directory.php
          php -l api/reservations.php

      - name: Check authentication JavaScript syntax
        run: |
          node --check assets/js/auth-page.js
          node --check assets/js/admin-leader-directory.js

      - name: Check Google sign-in wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('api/auth.php').read_text()
          page = Path('auth.html').read_text()
          script = Path('assets/js/auth-page.js').read_text()
          config = Path('api/turnstile-config.php').read_text()
          admin_actions = Path('api/admin-leader-actions.php').read_text()
          admin_directory = Path('api/admin-user-directory.php').read_text()
          admin_script = Path('assets/js/admin-leader-directory.js').read_text()

          checks = {
              'five-minute nonce endpoint': "action === 'google_nonce'" in auth and 'time() + 300' in auth,
              'nonce checked against Google token': "['nonce']" in auth and 'google_nonce_expires' in auth,
              'Family and Leader only': "['family','leader']" in auth,
              'verified Google email required': "email_verified" in auth,
              'Google button exists': 'id="googleSignIn"' in page,
              'Google config and GIS scripts load': 'api/google-config.php' in page and 'accounts.google.com/gsi/client' in page,
              'browser sends nonce and selected account context': 'nonceData.nonce' in script and 'context,' in script,
              'volunteer Google button is hidden': 'wrap.hidden=context==="volunteer"' in script,
              'Turnstile checks both email registration handlers': auth.count('bh_turnstile_registration_verify($body);') >= 2,
              'registration browser sends a ready Turnstile token': 'p.turnstile_token=turnstileToken' in script and '!turnstileWidgetReady||!turnstileToken' in script,
              'public Turnstile config exposes site key only': "'site_key'=>$enabled?$site:''" in config and 'secret' not in config.split('echo json_encode',1)[1].lower(),
              'admin leader actions require session CSRF': 'invalid_csrf' in admin_actions and 'hash_equals($expected,$provided)' in admin_actions,
              'admin directory issues session CSRF': "'csrf'=>$_SESSION['bh_admin_csrf']" in admin_directory,
              'admin directory UI sends CSRF': 'status:requestedStatus,csrf' in admin_script and 'confirmation,csrf' in admin_script,
          }

          for label, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {label}")
          if not all(checks.values()):
              raise SystemExit(1)
          PY
