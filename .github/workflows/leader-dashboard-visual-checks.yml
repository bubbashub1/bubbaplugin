name: Leader dashboard visual checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'leader.html'
      - 'assets/css/leader-dashboard-v3.css'
      - 'assets/js/leader-dashboard-overview.js'
      - '.github/workflows/leader-dashboard-visual-checks.yml'
  push:
    branches:
      - 'feature/leader-dashboard-visual-20261111'
    paths:
      - 'leader.html'
      - 'assets/css/leader-dashboard-v3.css'
      - 'assets/js/leader-dashboard-overview.js'
      - '.github/workflows/leader-dashboard-visual-checks.yml'
  workflow_dispatch:
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dashboard JavaScript syntax
        run: node --check assets/js/leader-dashboard-overview.js
      - name: Check dashboard structure, navigation and CSS
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path("leader.html").read_text(encoding="utf-8")
          css = Path("assets/css/leader-dashboard-v3.css").read_text(encoding="utf-8")
          js = Path("assets/js/leader-dashboard-overview.js").read_text(encoding="utf-8")

          class DashboardParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.add(attrs["id"])
                  if tag == "a" and attrs.get("href"):
                      self.links.add(attrs["href"])

          parser = DashboardParser()
          parser.feed(html)

          required_links = [
              "/leader/new.html", "/leader/classes.html", "/leader/schedule.html",
              "/leader/venues.html", "/leader/bookings.html", "/leader/messages.html",
              "/leader/profile.html", "/leader/specialisms.html", "/leader/faqs.html",
              "/leader/statistics.html", "/leader/payments.html"
          ]
          for link in required_links:
              assert link in parser.links, f"Missing leader navigation link: {link}"

          required_ids = [
              "leaderWelcome", "addListingButton", "leaderFrontPageLink",
              "leaderV3Classes", "leaderV3Sessions", "leaderV3NewBookings",
              "leaderV3Rating", "leaderV3Schedule", "leaderV3Bookings",
              "leaderV3Messages", "portalMessage"
          ]
          for element_id in required_ids:
              assert element_id in parser.ids, f"Missing dashboard integration hook: {element_id}"

          assert 'leader-dashboard-v3.css' in html, "Dashboard stylesheet is not linked"
          assert 'leader-dashboard-overview.js' in html, "Dashboard data renderer is not linked"
          assert 'leader-entry-card' not in html, "Old tile-grid navigation is still present"
          assert '/api/leader-portal.php' in js, "Live leader portal API is not used"
          assert '/api/leader-messages.php' in js, "Live messages API is not used"
          assert 'leaderV3NewBookings' in js and 'leaderV3Sparkline' in js, "Booking metric or sparkline hook is missing"
          assert 'Parent feedback' in html and "don't display sample or invented ratings" in html
          assert css.count("{") == css.count("}"), "Unbalanced CSS braces"
          assert "@media(max-width:760px)" in css, "Mobile navigation breakpoint is missing"
          print("Leader dashboard structure and responsive CSS checks passed.")
          PY
