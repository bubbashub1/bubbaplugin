name: Bubba Hub Android APK
on:
  push:
    branches:
      - feature/android-hybrid-app
      - feature/android-app-v2-playful
    paths:
      - 'mobile/android-app/**'
      - '.github/workflows/bubba-hub-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx cap add android
      - name: Apply Android back navigation handler
        run: cp native/MainActivity.java android/app/src/main/java/uk/co/bubbahub/app/MainActivity.java
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: bubba-hub-android-debug
          path: mobile/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
