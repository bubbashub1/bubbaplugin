name: Deployment trigger security lint

on:
  pull_request:
    paths:
      - 'deploy.php'
      - '.github/workflows/deploy-trigger-security-lint.yml'
  push:
    branches: [main]
    paths:
      - 'deploy.php'
      - '.github/workflows/deploy-trigger-security-lint.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check PHP syntax
        run: php -l deploy.php
