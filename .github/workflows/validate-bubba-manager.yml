name: Validate Bubba Hub Manager PHP
on:
  pull_request:
    paths:
      - 'wp-content/mu-plugins/bubbahub-manager/**'
      - 'wp-content/mu-plugins/bubbahub-manager.php'
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint MU plugin PHP
        run: |
          php -l wp-content/mu-plugins/bubbahub-manager.php
          php -l wp-content/mu-plugins/bubbahub-manager/bubba-hub-manager.php
