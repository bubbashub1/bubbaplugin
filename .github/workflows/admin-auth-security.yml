name: Admin authentication PHP check
on:
  pull_request:
    paths:
      - 'admin-auth.php'
      - '.github/workflows/admin-auth-security.yml'
  push:
    branches:
      - main
    paths:
      - 'admin-auth.php'
      - '.github/workflows/admin-auth-security.yml'
  workflow_dispatch:
jobs:
  admin-auth-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check admin authentication PHP syntax
        run: php -l admin-auth.php
