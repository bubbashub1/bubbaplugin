name: Site Manager checks

on:
  pull_request:
    paths:
      - 'api/admin-site-settings.php'
      - 'admin/admin-site-manager.html'
      - 'assets/js/admin-site-manager.js'
      - 'assets/css/admin-site-manager.css'
      - '.github/workflows/site-manager-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'api/admin-site-settings.php'
      - 'admin/admin-site-manager.html'
      - 'assets/js/admin-site-manager.js'
      - 'assets/css/admin-site-manager.css'
      - '.github/workflows/site-manager-checks.yml'

permissions:
  contents: read

jobs:
  syntax:
    name: PHP and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Lint Site Manager API
        run: php -l api/admin-site-settings.php
      - name: Check browser JavaScript syntax
        run: node --check assets/js/admin-site-manager.js
