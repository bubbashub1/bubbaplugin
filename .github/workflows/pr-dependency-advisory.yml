name: Bubba Hub PR dependency advisory
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  related-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Review shared ownership and changed paths
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const number = context.issue.number;
            const marker = '<!-- bubba-pr-dependencies -->';
            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path: 'docs/pr-dependency-registry.json', ref: context.payload.repository.default_branch
            });
            const registry = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100
            });
            const matching = registry.groups.filter(group =>
              group.primary_pr === number ||
              group.related_prs.includes(number) ||
              changed.some(file => group.path_prefixes.some(prefix => file.filename.startsWith(prefix)))
            );
            const lines = matching.map(group => {
              const linked = [...new Set([group.primary_pr, ...group.related_prs])]
                .filter(n => n !== number).map(n => '#' + n).join(', ');
              return '- **' + group.id + '** (issue #' + group.issue +
                '): primary PR #' + group.primary_pr +
                '; related: ' + (linked || 'none') + '.';
            });
            const body = marker + '\n### Bubba Hub dependency advisory\n' +
              (lines.length ? lines.join('\n') : 'No matching ownership group in the current registry.') +
              '\n\nReview related PRs before editing shared schema/APIs. This check **does not sync branches, merge, or deploy**. Update the registry when ownership changes.';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
