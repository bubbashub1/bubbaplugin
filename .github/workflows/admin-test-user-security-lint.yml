name: Admin test-user PHP lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/admin-test-users.php'
      - '.github/workflows/admin-test-user-security-lint.yml'
  push:
    branches: [security/protect-admin-test-user-actions]
    paths:
      - 'api/admin-test-users.php'
      - '.github/workflows/admin-test-user-security-lint.yml'

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Check admin test-user endpoint syntax
        run: php -l api/admin-test-users.php
