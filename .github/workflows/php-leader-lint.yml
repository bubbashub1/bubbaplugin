name: Leader PHP syntax check
on:
  pull_request:
    paths:
      - 'admin-auth.php'
      - 'admin-auth.php'
      - 'api/leader-portal.php'
      - 'api/db.php'
      - 'api/mailer.php'
      - '.github/workflows/php-leader-lint.yml'
  push:
    paths:
      - 'api/leader-portal.php'
      - 'api/db.php'
      - 'api/mailer.php'
      - '.github/workflows/php-leader-lint.yml'
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -l admin-auth.php
          php -l api/leader-portal.php
          php -l api/db.php
          php -l api/mailer.php
