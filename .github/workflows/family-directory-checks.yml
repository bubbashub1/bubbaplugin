name: Family directory checks

on:
  pull_request:
    branches: [staging-site]
    paths:
      - 'api/admin-directory-sectors.php'
      - 'api/directory-sector.php'
      - 'api/admin-directory-businesses.php'
      - 'assets/js/directory-sector.js'
      - 'childcare-schools.html'
      - 'places-days-out.html'
      - 'school-clubs.html'
      - 'businesses.html'
      - 'admin/admin-directory-sectors.html'
      - '.github/workflows/family-directory-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-directory-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Check PHP syntax
        run: |
          set -eu
          php -l api/admin-directory-sectors.php
          php -l api/directory-sector.php
          php -l api/admin-directory-businesses.php
      - name: Check public directory JavaScript
        run: node --check assets/js/directory-sector.js
      - name: Verify directory separation and public fields
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path("api/directory-sector.php").read_text()
          client = Path("assets/js/directory-sector.js").read_text()
          admin = Path("api/admin-directory-sectors.php").read_text()
          expected = {
              "childcare": ("bh_directory_childcare", "registration_body", "registration_reference", "verification_url", "verified_on"),
              "place": ("bh_directory_places", "facilities"),
              "school_club": ("bh_directory_school_clubs", "school_name", "age_min", "age_max", "days_times", "collection_arrangements", "price_details", "verification_url", "verified_on"),
          }
          for sector, values in expected.items():
              assert sector in api, f"Missing {sector} public API mapping"
              for value in values:
                  assert value in api or value in admin, f"Missing {value} field mapping"
          assert "status='published'" in api, "Only published sector records may be public"
          assert "sectorDetails(x)" in client, "Sector-specific public details are not rendered"
          for field in ("registration_body", "registration_reference", "verified_on", "facilities", "school_name", "age_min", "age_max", "days_times", "collection_arrangements", "price_details", "verification_url"):
              assert field in client, f"Public card is missing {field}"
          for path, sector in (("childcare-schools.html", 'data-sector="childcare"'), ("places-days-out.html", 'data-sector="place"'), ("school-clubs.html", 'data-sector="school_club"')):
              page = Path(path).read_text()
              assert sector in page, f"{path} has the wrong sector key"
              assert '/assets/js/directory-sector.js' in page, f"{path} is missing its sector client"
              assert '/assets/js/directory-universal.js' not in page, f"{path} must not inject universal Activities results"
          assert "bh_admin_authenticated" in admin and "csrf" in admin.lower(), "Admin API authentication/CSRF guard missing"
          print("Family directory schema, public visibility, presentation and page separation checks passed")
          PY
