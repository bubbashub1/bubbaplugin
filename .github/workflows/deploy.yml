name: Deploy BubbaPlugin to eWebAll

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eweball-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EWEBALL_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/eweball_deploy_key"
          chmod 600 "$RUNNER_TEMP/eweball_deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/eweball_deploy_key" >/dev/null

      - name: Prepare SSH connection
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          # Accept the eWebAll host key during the SSH connection so a
          # failed ssh-keyscan cannot block deployment before SFTP starts.
          : > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Check eWebAll SFTP root
        env:
          SSH_HOST: ${{ secrets.EWEBALL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.EWEBALL_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.EWEBALL_SSH_PORT }}
        run: |
          set -euo pipefail
          printf 'pwd\nls -la\n' > "$RUNNER_TEMP/check.sftp"
          sftp -b "$RUNNER_TEMP/check.sftp" -P "$SSH_PORT" -i "$RUNNER_TEMP/eweball_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$SSH_USERNAME@$SSH_HOST"

      - name: Deploy via OpenSSH SFTP
        env:
          SSH_HOST: ${{ secrets.EWEBALL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.EWEBALL_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.EWEBALL_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.EWEBALL_REMOTE_PATH }}
        run: |
          set -euo pipefail
          SFTP_BATCH="$RUNNER_TEMP/deploy.sftp"
          : > "$SFTP_BATCH"
          printf 'cd "%s"\n' "$REMOTE_PATH" >> "$SFTP_BATCH"
          # Upload root files first, then each top-level directory recursively.
          # This avoids hundreds of individual SFTP mkdir/put operations, which
          # can trigger eWebAll SFTP disconnects during large deployments.
          find . -maxdepth 1 -type f ! -name '.gitignore' ! -name 'README.md' -printf 'put "%p"\n' >> "$SFTP_BATCH"
          if [ ! -f "OneSignalSDKWorker.js" ]; then
            echo "ERROR: OneSignalSDKWorker.js is missing from the repository root." >&2
            exit 1
          fi
          for dir in api assets data library images schools account; do
            if [ -d "$dir" ]; then
              printf 'put -r "%s"\n' "$dir" >> "$SFTP_BATCH"
            fi
          done
          sftp -b "$SFTP_BATCH" -P "$SSH_PORT" -i "$RUNNER_TEMP/eweball_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$SSH_USERNAME@$SSH_HOST"
          echo "Deployment upload finished."
          printf 'cd "%s"\n' "$REMOTE_PATH" > "$RUNNER_TEMP/verify.sftp"
          printf 'ls -l index.html\n' >> "$RUNNER_TEMP/verify.sftp"
          printf 'ls -l OneSignalSDKWorker.js\n' >> "$RUNNER_TEMP/verify.sftp"
          printf 'ls -l assets/css/styles.css\n' >> "$RUNNER_TEMP/verify.sftp"
          printf 'ls -l assets/js/app.js\n' >> "$RUNNER_TEMP/verify.sftp"
          printf 'ls -l data/activities.json\n' >> "$RUNNER_TEMP/verify.sftp"
          printf 'ls -l images/home\n' >> "$RUNNER_TEMP/verify.sftp"
          printf 'ls -l schools/index.html\n' >> "$RUNNER_TEMP/verify.sftp"
          sftp -b "$RUNNER_TEMP/verify.sftp" -P "$SSH_PORT" -i "$RUNNER_TEMP/eweball_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$SSH_USERNAME@$SSH_HOST"
          echo "Deployment completed and remote files verified successfully."
