name: Deploy BubbaPlugin to eWebAll
# Production deployment workflow — main is the live source of truth.
# Triggered on every push to main; do not remove.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eweball-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EWEBALL_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/eweball_deploy_key"
          chmod 600 "$RUNNER_TEMP/eweball_deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/eweball_deploy_key" >/dev/null

      - name: Prepare SSH connection
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          : > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Check eWebAll SSH connection
        env:
          SSH_HOST: ${{ secrets.EWEBALL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.EWEBALL_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.EWEBALL_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" \
            -i "$RUNNER_TEMP/eweball_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$SSH_USERNAME@$SSH_HOST" '
              echo "=== CURRENT USER ==="
              whoami
              echo "=== HOME ==="
              echo "$HOME"
              echo "=== PWD ==="
              pwd
              echo "=== HOME CONTENTS ==="
              ls -la "$HOME"
              echo "=== ROOT CONTENTS ==="
              ls -la /
              echo "=== PUBLIC_HTML SEARCH ==="
              find "$HOME" -maxdepth 3 -type d -name public_html -print 2>/dev/null || true
            '

      - name: Deploy via SSH tar stream
        env:
          SSH_HOST: ${{ secrets.EWEBALL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.EWEBALL_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.EWEBALL_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.EWEBALL_REMOTE_PATH }}
        run: |
          set -euo pipefail

          # Never deploy into an unset or unexpected directory.
          if [ -z "$REMOTE_PATH" ] || [ "$REMOTE_PATH" = "/" ] || [[ "$REMOTE_PATH" != *public_html* ]]; then
            echo "Refusing deployment: EWEBALL_REMOTE_PATH must point to public_html." >&2
            exit 1
          fi

          if [ ! -f "OneSignalSDKWorker.js" ]; then
            echo "ERROR: OneSignalSDKWorker.js is missing from the repository root." >&2
            exit 1
          fi

          echo "Building deployment archive..."
          DEPLOY_ARCHIVE="$RUNNER_TEMP/bubbaplugin-deploy.tar.gz"

          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./README.md' \
            --exclude='./.gitignore' \
            -czf "$DEPLOY_ARCHIVE" .

          echo "Uploading deployment archive..."
          scp \
            -P "$SSH_PORT" \
            -i "$RUNNER_TEMP/eweball_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_ARCHIVE" \
            "$SSH_USERNAME@$SSH_HOST:/tmp/bubbaplugin-deploy.tar.gz"

          echo "Checking uploaded archive on eWebAll..."
          ssh \
            -p "$SSH_PORT" \
            -i "$RUNNER_TEMP/eweball_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$SSH_USERNAME@$SSH_HOST" \
            "ls -lh /tmp/bubbaplugin-deploy.tar.gz && tar -tzf /tmp/bubbaplugin-deploy.tar.gz >/dev/null && echo 'Archive verified successfully.'"

          echo "Extracting deployment on eWebAll..."
          ssh \
            -p "$SSH_PORT" \
            -i "$RUNNER_TEMP/eweball_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p \"$REMOTE_PATH\" && tar -xzf /tmp/bubbaplugin-deploy.tar.gz -C \"$REMOTE_PATH\" && rm -f /tmp/bubbaplugin-deploy.tar.gz"

          echo "Deployment archive extracted successfully."
          echo "Deployment completed (archive contents were verified before extraction)."
