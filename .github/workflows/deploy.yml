name: Deploy BubbaPlugin to eWebAll

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eweball-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.EWEBALL_SSH_HOST }}
          username: ${{ secrets.EWEBALL_SSH_USERNAME }}
          port: ${{ secrets.EWEBALL_SSH_PORT }}
          ssh_private_key: ${{ secrets.EWEBALL_SSH_PRIVATE_KEY }}
          local_path: './*'
          remote_path: ${{ secrets.EWEBALL_REMOTE_PATH }}
          sftp_only: true
          rsyncArgs: '--exclude=.git --exclude=.github --exclude=README.md'
