name: Deploy BubbaPlugin to eWebAll

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eweball-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EWEBALL_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/eweball_deploy_key"
          chmod 600 "$RUNNER_TEMP/eweball_deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/eweball_deploy_key" >/dev/null

      - name: Prepare SSH connection
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          # Accept the eWebAll host key during the SSH connection so a
          # failed ssh-keyscan cannot block deployment before SFTP starts.
          : > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Check eWebAll SSH connection
        env:
          SSH_HOST: ${{ secrets.EWEBALL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.EWEBALL_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.EWEBALL_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/eweball_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$SSH_USERNAME@$SSH_HOST" 'pwd && ls -la'

      - name: Deploy via legacy SCP
        env:
          SSH_HOST: ${{ secrets.EWEBALL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.EWEBALL_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.EWEBALL_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.EWEBALL_REMOTE_PATH }}
        run: |
          set -euo pipefail
          if [ ! -f "OneSignalSDKWorker.js" ]; then
            echo "ERROR: OneSignalSDKWorker.js is missing from the repository root." >&2
            exit 1
          fi

          DEST="$SSH_USERNAME@$SSH_HOST:$REMOTE_PATH"

          # eWebAll is accepting SSH but closing the SFTP subsystem with
          # exit 255. Force OpenSSH's legacy SCP protocol instead of SFTP.
          find . -maxdepth 1 -type f ! -name '.gitignore' ! -name 'README.md' -print0 |
            while IFS= read -r -d '' file; do
              scp -O -P "$SSH_PORT" -i "$RUNNER_TEMP/eweball_deploy_key" \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                "$file" "$DEST/"
            done

          for dir in api assets data library images schools account; do
            if [ -d "$dir" ]; then
              scp -O -r -P "$SSH_PORT" -i "$RUNNER_TEMP/eweball_deploy_key" \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
                "$dir" "$DEST/"
            fi
          done

          echo "Deployment upload finished."

          ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/eweball_deploy_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$SSH_USERNAME@$SSH_HOST" \
            "cd \"$REMOTE_PATH\" && ls -l index.html OneSignalSDKWorker.js assets/css/styles.css assets/js/app.js data/activities.json schools/index.html"

          echo "Deployment completed and remote files verified successfully."
