name: Listing Checker PHP and security checks

on:
  push:
    branches:
      - feature/listing-health-checker
      - feature/listing-checker-structured-search
      - feature/shared-listing-monitor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint Listing Checker PHP
        run: |
          set -eu
          for file in \
            api/admin-listing-checker-settings.php \
            api/admin-listing-health.php \
            api/admin-listing-review.php \
            api/listing-checker-health-cron.php \
            api/listing-checker-discovery-cron.php \
            api/listing-checker-preflight.php \
            api/admin-listing-monitor-drafts.php \
            api/listing-monitor-website-cron.php \
            api/listing-monitor-website-rules.php \
            tests/listing-monitor-website-rules.php \
            tests/listing-monitor-database-integration.php
          do
            php -l "$file"
          done
      - name: Verify critical security guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "bh_admin_authenticated" api/admin-listing-checker-settings.php
          grep -q "hash_equals" api/admin-listing-checker-settings.php
          grep -q "HTTP_ORIGIN" api/admin-listing-checker-settings.php
          grep -q "CONTENT_LENGTH" api/admin-listing-checker-settings.php
          grep -q "bh_admin_authenticated" api/admin-listing-review.php
          grep -q "hash_equals" api/admin-listing-review.php
          grep -q "HTTP_ORIGIN" api/admin-listing-review.php
          grep -q "CONTENT_LENGTH" api/admin-listing-review.php
          grep -q "PHP_SAPI !== 'cli'" api/listing-checker-health-cron.php
          grep -q "PHP_SAPI !== 'cli'" api/listing-checker-discovery-cron.php
          grep -q "PHP_SAPI !== 'cli'" api/listing-checker-preflight.php
          grep -q "GET_LOCK" api/listing-checker-health-cron.php
          grep -q "GET_LOCK" api/listing-checker-discovery-cron.php
          ! grep -q "CURLOPT_FOLLOWLOCATION=>true" api/listing-checker-discovery-cron.php
          grep -q "2097152" api/listing-checker-discovery-cron.php
          grep -q "next_check_at=DATE_ADD(NOW(), INTERVAL" api/listing-checker-health-cron.php
          grep -q "Refresh an existing matching finding" api/listing-checker-health-cron.php
          grep -q "stale_listing" api/listing-checker-health-cron.php
          grep -q "health_enabled','0'" database/listing-checker-schema.sql
          grep -q "discovery_enabled','0'" database/listing-checker-schema.sql
          grep -q "get('health_enabled','0')" api/listing-checker-health-cron.php
          grep -q "get('discovery_enabled','0')" api/listing-checker-discovery-cron.php
          grep -q "source_platform" api/admin-listing-checker-settings.php
          grep -q "search_keywords" api/admin-listing-checker-settings.php
          grep -q "frequency_hours" api/admin-listing-checker-settings.php
          grep -q "site:facebook.com" api/listing-checker-discovery-cron.php
          grep -q "site:instagram.com" api/listing-checker-discovery-cron.php
          grep -q "DATE_ADD(last_searched_at, INTERVAL frequency_hours HOUR)" api/listing-checker-discovery-cron.php
          test -f database/listing-checker-search-settings-migration.sql
          grep -q "columnsFor('bh_activity_schedules')" api/listing-checker-health-cron.php
          grep -q "bh_admin_authenticated" api/admin-listing-monitor-drafts.php
          grep -q "hash_equals" api/admin-listing-monitor-drafts.php
          grep -q "approve_draft" api/admin-listing-monitor-drafts.php
          grep -q "original_snapshot" api/admin-listing-monitor-drafts.php
          grep -q "PHP_SAPI !== 'cli'" api/listing-monitor-website-cron.php
          grep -q "GET_LOCK" api/listing-monitor-website-cron.php
          grep -q "CURLOPT_SSL_VERIFYPEER=>true" api/listing-monitor-website-cron.php
          grep -q "CURLOPT_RESOLVE" api/listing-monitor-website-cron.php
          grep -q "bodyTooLarge" api/listing-monitor-website-cron.php
          grep -q "unable_to_verify" api/listing-monitor-website-cron.php
          grep -q "possible_closure" api/listing-monitor-website-cron.php
          grep -q "closure_indicated" api/listing-monitor-website-cron.php
          grep -q "temporary_closure" api/listing-monitor-website-cron.php
          grep -q "bh_listing_monitor_website_state" database/migrations/20261122_create_listing_monitor_website_checks.sql
          grep -q "bh_listing_monitor_website_history" database/migrations/20261122_create_listing_monitor_website_checks.sql
          ! grep -Eq "UPDATE[[:space:]]+bh_activities|DELETE[[:space:]]+FROM[[:space:]]+bh_activities" api/listing-monitor-website-cron.php
      - name: Run Listing Monitor offline rule tests
        run: php tests/listing-monitor-website-rules.php

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none
      - name: Create disposable test database
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE listing_monitor_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - name: Run Listing Monitor database integration tests
        env:
          LISTING_MONITOR_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=listing_monitor_test;charset=utf8mb4
          LISTING_MONITOR_TEST_USER: root
          LISTING_MONITOR_TEST_PASSWORD: root
        run: php tests/listing-monitor-database-integration.php
