name: Family suggestions and nap planner checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/planner-pro.php'
      - 'assets/js/family.js'
      - 'assets/js/personalise.js'
      - 'assets/js/planner.js'
      - 'assets/js/planner-pro.js'
      - 'account/family.html'
      - 'choose.html'
      - 'planner.html'
      - 'database/migrations/021_planner_pro_state.sql'
      - '.github/workflows/family-suggestions-checks.yml'

permissions:
  contents: read

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: php -l api/planner-pro.php
      - name: Check JavaScript syntax
        run: |
          set -eu
          node --check assets/js/family.js
          node --check assets/js/personalise.js
          node --check assets/js/planner.js
          node --check assets/js/planner-pro.js
      - name: Verify planner storage is migration-managed
        run: |
          set -eu
          grep -q 'CREATE TABLE IF NOT EXISTS bh_planner_pro_state' database/migrations/021_planner_pro_state.sql
          ! grep -q 'CREATE TABLE IF NOT EXISTS bh_planner_pro_state' api/planner-pro.php
          ! grep -q 'CREATE TABLE IF NOT EXISTS bh_user_subscriptions' api/planner-pro.php
