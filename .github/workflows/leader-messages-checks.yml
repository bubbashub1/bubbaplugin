name: Leader messages checks

on:
  pull_request:
    paths:
      - 'api/leader-messages.php'
      - 'leader/messages.html'
      - 'database/migrations/008_leader_messages.sql'
      - '.github/workflows/leader-messages-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'api/leader-messages.php'
      - 'leader/messages.html'
      - 'database/migrations/008_leader_messages.sql'
      - '.github/workflows/leader-messages-checks.yml'

permissions:
  contents: read

jobs:
  messaging-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: Check PHP syntax
        run: php -l api/leader-messages.php
      - name: Check messaging security and migration wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api = Path('api/leader-messages.php').read_text()
          page = Path('leader/messages.html').read_text()
          migration = Path('database/migrations/008_leader_messages.sql').read_text()
          checks = {
              'no request-time DDL': 'CREATE TABLE' not in api and 'ALTER TABLE' not in api,
              'explicit storage readiness check': "TABLE_NAME='bh_leader_messages'" in api,
              'leader replies require CSRF': "HTTP_X_BH_CSRF" in api and "hash_equals($_SESSION['bh_csrf']" in api,
              'leader inbox returns CSRF token': "'csrf' => $_SESSION['bh_csrf']" in api,
              'message page sends CSRF token': 'X-BH-CSRF' in page and 'csrfToken' in page,
              'migration creates indexed message storage': 'CREATE TABLE IF NOT EXISTS bh_leader_messages' in migration and 'idx_leader_messages_organiser' in migration,
              'organiser ownership scopes message reads and writes': 'WHERE m.organiser_id=?' in api and 'WHERE id=? AND organiser_id=?' in api,
          }
          for label, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {label}")
          if not all(checks.values()):
              raise SystemExit(1)
          PY
