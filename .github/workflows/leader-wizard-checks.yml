name: Leader listing wizard checks
on:
  push:
    branches:
      - 'feature/leader-listing-wizard-admin-parity'
  pull_request:
    paths:
      - 'leader/new.html'
      - 'assets/js/leader-new/**'
      - 'api/leader-portal.php'
      - '.github/workflows/leader-wizard-checks.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check leader PHP syntax
        run: php -l api/leader-portal.php
      - name: Check leader wizard JavaScript syntax
        run: |
          for file in assets/js/leader-new/*.js; do
            node --check "$file"
          done
