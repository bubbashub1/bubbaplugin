<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exhibit at Bubba & Me | Bubba Hub</title><link rel="stylesheet" href="/styles.css"><style>body{font-family:Quicksand,Calibri,sans-serif;background:#f5f8f4;color:#144400}.wrap{max-width:700px;margin:32px auto;padding:16px}.panel{background:#fff;border-radius:20px;padding:25px}label{display:block;margin:14px 0 6px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #9fb7a5;border-radius:10px;padding:12px}button{background:#144400;color:#fff;border:0;border-radius:28px;padding:13px 24px;margin-top:20px}</style></head><body><main class="wrap"><a href="/events.html">← Events</a><section class="panel"><h1>Bubba & Me Expo</h1><h2>Apply to exhibit</h2><p>Saturday 9 January 2027 · Acorn Centre, Torquay</p><form id="form"><label>Business name *<input name="business_name" required maxlength="190"></label><label>Your name *<input name="contact_name" required maxlength="190"></label><label>Email *<input type="email" name="contact_email" required></label><label>Telephone<input type="tel" name="contact_phone"></label><label>Website<input type="url" name="website"></label><label>Tell us about your business *<textarea name="business_description" required rows="4"></textarea></label><label>Stall requirements (space, table, electricity)<textarea name="stall_requirements"></textarea></label><label>Taster sessions, goody bags or offers<textarea name="participation_notes"></textarea></label><input name="website_check" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><button type="submit">Submit application</button><p id="status" role="status"></p></form></section></main><script>const form=document.getElementById('form'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();let id=new URLSearchParams(location.search).get('event');if(!id||!/^[0-9]+$/.test(id)){status.textContent='The exhibitor registration link is missing an event ID.';return}let data=Object.fromEntries(new FormData(form));data.event_id=Number(id);data.website=data.website||'';data.website_check=data.website_check||'';let btn=form.querySelector('button');btn.disabled=true;try{let r=await fetch('/api/event-exhibitors.php?action=apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!j.ok)throw Error(j.error||'Unable to submit');status.textContent='Application received for review.';form.reset()}catch(err){status.textContent=err.message}finally{btn.disabled=false}})</script></body></html>
