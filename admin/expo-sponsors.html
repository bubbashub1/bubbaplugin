<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expo Sponsor Manager</title><style>body{font:16px system-ui;background:#f2faf3;color:#174b33;margin:0}main{max-width:850px;margin:auto;padding:22px}form,.card{background:white;border:1px solid #c6decf;border-radius:18px;padding:20px;margin:16px 0}label{display:block;margin:12px 0;font-weight:600}input:not([type=checkbox]){display:block;box-sizing:border-box;width:100%;padding:10px;border:1px solid #9abbaa;border-radius:10px;font:inherit}button{background:#17644d;color:white;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font:inherit;margin:4px}.card{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.card img{max-width:95px;max-height:75px;object-fit:contain}</style></head><body><main><a href="/expo.html">← Expo page</a><h1>Expo Sponsor Manager</h1><p>Only sponsors marked both approved and publicly visible appear on the Expo carousel. Confirm permission to display each logo. Payments are handled separately.</p><p id="status" role="status">Checking admin access…</p><form id="editor" hidden><input type="hidden" name="id"><label>Business name<input name="business_name" maxlength="160" required></label><label>Website HTTPS URL<input name="website_url" type="url" placeholder="https://"></label><label>Logo HTTPS URL<input name="logo_url" type="url" placeholder="https://"></label><label>Display order<input name="sort_order" type="number" value="0" min="-10000" max="10000"></label><label><input name="approved" type="checkbox"> Sponsor approved</label><label><input name="public_visible" type="checkbox"> Public display permission confirmed</label><button type="submit">Save sponsor</button><button type="button" id="clearSponsorForm">Add another</button></form><h2>Saved sponsors</h2><div id="items"></div></main><script>
const form=document.getElementById('editor'),status=document.getElementById('status'),items=document.getElementById('items');let csrf='';
async function load(){try{const r=await fetch('/api/expo-sponsors-admin.php',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Unable to load');csrf=d.csrf;form.hidden=false;items.replaceChildren();status.textContent='Admin access confirmed';for(const s of d.sponsors){const card=document.createElement('article');card.className='card';if(s.logo_url){const img=document.createElement('img');img.src=s.logo_url;img.alt='';img.onerror=()=>img.remove();card.append(img);}const info=document.createElement('div');const title=document.createElement('strong');title.textContent=s.business_name;const detail=document.createElement('p');detail.textContent=s.approved&&s.public_visible?'Public sponsor':'Not public';info.append(title,detail);const edit=document.createElement('button');edit.type='button';edit.textContent='Edit';edit.onclick=()=>{for(const el of form.elements){if(!el.name)continue;if(el.type==='checkbox')el.checked=Boolean(Number(s[el.name]));else el.value=s[el.name]??'';}form.scrollIntoView({behavior:'smooth'});};card.append(info,edit);items.append(card);}if(!d.sponsors.length)items.textContent='No sponsors added yet.';}catch(e){status.textContent='Unable to load sponsors: '+e.message;}}
form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));data.id=Number(data.id||0);data.approved=form.elements.approved.checked;data.public_visible=form.elements.public_visible.checked;status.textContent='Saving…';try{const r=await fetch('/api/expo-sponsors-admin.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Save failed');HTMLFormElement.prototype.reset.call(form);form.elements.id.value='';await load();status.textContent='Sponsor saved';}catch(e){status.textContent='Unable to save: '+e.message;}});document.getElementById('clearSponsorForm').onclick=()=>{HTMLFormElement.prototype.reset.call(form);form.elements.id.value='';};load();
</script></body></html>
