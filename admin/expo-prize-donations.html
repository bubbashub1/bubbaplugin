<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expo Prize Donations | Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css"><body style="max-width:1000px;margin:2rem auto;padding:1rem"><a href="/admin.html">← Admin</a><h1>🎁 Incoming Prize Donations</h1><p>Approving creates a draft raffle prize. Publish separately from the raffle prize manager.</p><p id="status" role="status"></p><div id="submissions"></div><script>
let csrf='';const status=document.getElementById('status'),list=document.getElementById('submissions');
async function load(){try{const r=await fetch('/api/expo-public-prize-review.php',{credentials:'same-origin'}),d=await r.json();if(!d.ok)throw Error(d.error||'Unavailable');csrf=d.csrf;list.replaceChildren();if(!d.submissions.length)status.textContent='No donations yet.';else status.textContent=d.submissions.filter(x=>x.status==='pending').length+' pending';for(const s of d.submissions){const card=document.createElement('article');card.style='border:1px solid #b7d6c3;border-radius:14px;padding:16px;margin:12px 0';const title=document.createElement('h2');title.textContent=s.title+' — '+s.status;card.append(title);for(const [k,v] of Object.entries({Donor:s.donor_name,Email:s.email,Description:s.description,Value:s.prize_value,Website:s.donor_url,Collection:s.collection_details,Public_credit:s.public_credit?'Yes':'No'})){const p=document.createElement('p');p.textContent=k+': '+(v||'—');card.append(p)}if(s.status==='pending')for(const action of ['approve','reject']){const b=document.createElement('button');b.textContent=action==='approve'?'Approve as draft':'Reject';b.style='margin:8px;padding:10px';b.onclick=async()=>{if(!confirm(action+' this donation?'))return;b.disabled=true;try{const r=await fetch('/api/expo-public-prize-review.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({id:s.id,action})}),d=await r.json();if(!d.ok)throw Error(d.error);await load()}catch(e){status.textContent='Could not save: '+e.message;b.disabled=false}};card.append(b)}list.append(card)}}catch(e){status.textContent='Unable to load donations: '+e.message}}load();
</script></body></html>
