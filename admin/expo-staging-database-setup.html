<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Expo Staging Database Setup</title><style>body{font:16px system-ui;background:#eff8f1;color:#164735;padding:20px}main{max-width:580px;margin:auto;background:#fff;border-radius:22px;padding:24px}button{background:#176244;color:#fff;border:0;border-radius:12px;padding:14px;font:inherit}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e6f1e9;padding:16px;border-radius:12px}</style></head><body><main><h1>Expo staging database setup</h1><p>Admin only. Creates four missing Expo tables; does not delete existing reservations or tickets.</p><p><strong>Staging only:</strong> Server must have BUBBAHUB_EXPO_STAGING_DB_NAME set to the expected staging database name. This action is never automatic.</p><label><input type="checkbox" id="agree"> I understand this will change the staging database.</label><p><button id="run" disabled>Create missing tables</button></p><pre id="result" role="status">Checking admin session…</pre></main><script>(()=>{'use strict';let csrf='',busy=false;const b=document.getElementById('run'),a=document.getElementById('agree'),out=document.getElementById('result');async function init(){try{const r=await fetch('/api/expo-admin-checkin-session.php',{credentials:'same-origin',cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok||!j.csrf)throw Error();csrf=j.csrf;b.disabled=false;out.textContent='Admin verified. Review before continuing.'}catch{out.textContent='Admin login required.'}}b.addEventListener('click',async()=>{if(!csrf||busy||!a.checked){out.textContent='Tick the confirmation box first.';return}if(!confirm('Create missing tables in the STAGING database?'))return;busy=true;b.disabled=true;out.textContent='Running staging migration…';try{const r=await fetch('/api/expo-admin-migrate-schema.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-BH-Admin-CSRF':csrf},body:JSON.stringify({confirm:'CREATE_EXPO_STAGING_TABLES'})}),j=await r.json();out.textContent=JSON.stringify(j,null,2);if(r.status===401||r.status===403)csrf=''}catch{out.textContent='Network error: verify schema state before retrying.'}finally{busy=false;b.disabled=!csrf;a.checked=false}});init()})();</script></body></html>
