<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expo exhibitor approvals · Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css"><style>body{font-family:Quicksand,Arial,sans-serif;background:#f3faf5;color:#164a3b;margin:0}.shell{max-width:1100px;margin:30px auto;padding:20px}h1{font-size:clamp(26px,4vw,40px)}.item{background:white;border:1px solid #d5e6db;border-radius:18px;padding:18px;margin:14px 0;display:grid;gap:12px}.meta{color:#526c61}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}select,button{font:inherit;border-radius:10px;padding:9px;border:1px solid #abcbb8}button{background:#17694f;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#17694f}img{width:110px;height:75px;object-fit:contain}.error{color:#9c3425}.overview-tools{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.overview-tools input,.overview-tools select{font:inherit;border:1px solid #abcbb8;border-radius:10px;padding:10px;background:white;min-width:170px}.table-scroll{overflow-x:auto;border:1px solid #d5e6db;border-radius:14px;background:white}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #e3eee7;vertical-align:middle}th{background:#e8f3eb;color:#164a3b;font-weight:700}tbody tr:hover{background:#f5faf6}.status-pill{border-radius:30px;padding:4px 9px;background:#e8f3eb;font-weight:700;font-size:12px;white-space:nowrap}.status-pill[data-status="pending"]{background:#fff0d6}.status-pill[data-status="rejected"],.status-pill[data-status="cancelled"]{background:#f7e5e5}.detail-panel{margin:14px 0}.detail-panel[hidden]{display:none}.row-action{white-space:nowrap}.muted{color:#526c61}</style></head><body><main class="shell"><a href="/admin">← Admin dashboard</a><h1>Expo exhibitor approvals</h1><p>Review sign-ups for the 9 January 2027 Expo. Approval and public listing are separate decisions. Changes affect the live database when this page is deployed on Live.</p><p id="notice" role="status" aria-live="polite">Checking admin access…</p><div class="overview-tools"><input id="exhibitorSearch" type="search" placeholder="Search exhibitor or contact" aria-label="Search exhibitors"><select id="exhibitorStatus" aria-label="Filter application status"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="cancelled">Cancelled</option></select></div><div class="table-scroll"><table aria-label="Expo exhibitor applications"><thead><tr><th>Business</th><th>Contact</th><th>Table</th><th>Status</th><th>Public</th><th>Details</th></tr></thead><tbody id="exhibitorRows"></tbody></table></div><div id="records"></div></main><script>
(async function(){
 const notice=document.getElementById('notice'),records=document.getElementById('records');let token='';
 const endpoint='/api/expo-admin-exhibitors.php';const tableRows=document.getElementById('exhibitorRows'),search=document.getElementById('exhibitorSearch'),statusFilter=document.getElementById('exhibitorStatus');
 function filterRows(){const q=search.value.trim().toLowerCase(),status=statusFilter.value;for(const row of tableRows.rows){const visible=(!status||row.dataset.status===status)&&(!q||row.dataset.search.includes(q));row.hidden=!visible;const panel=document.getElementById('exhibitor-detail-'+row.dataset.id);if(panel&&!visible)panel.hidden=true;}}
 search.addEventListener('input',filterRows);statusFilter.addEventListener('change',filterRows);
 async function load(){
  try{const r=await fetch(endpoint,{credentials:'same-origin',cache:'no-store'});const data=await r.json();if(!r.ok||!data.ok)throw new Error(r.status===401?'Admin login required.':'Could not load exhibitors.');
   token=data.csrf_token;records.replaceChildren();tableRows.replaceChildren();notice.textContent=data.exhibitors.length+' exhibitor application(s).';
   for(const e of data.exhibitors){
    const card=document.createElement('section');card.className='item detail-panel';card.id='exhibitor-detail-'+e.id;card.hidden=true;
    const tr=document.createElement('tr');tr.dataset.id=String(e.id);tr.dataset.status=e.application_status||'';tr.dataset.search=[e.business_name,e.contact_name,e.contact_email,e.preferred_table,e.assigned_table].join(' ').toLowerCase();
    const addCell=(value)=>{const td=document.createElement('td');td.textContent=value;tr.append(td);return td;};
    addCell(e.business_name||'Unnamed');const contactCell=addCell(e.contact_name||'');const emailSmall=document.createElement('div');emailSmall.className='muted';emailSmall.textContent=e.contact_email||'';contactCell.append(emailSmall);
    addCell(e.assigned_table||e.preferred_table||'—');const statusCell=addCell('');const pill=document.createElement('span');pill.className='status-pill';pill.dataset.status=e.application_status||'';pill.textContent=e.application_status||'Unknown';statusCell.append(pill);
    addCell(e.public_visible==1?'Visible':'Hidden');const actionCell=addCell('');const openButton=document.createElement('button');openButton.type='button';openButton.className='row-action';openButton.textContent='View / Edit';openButton.setAttribute('aria-expanded','false');openButton.setAttribute('aria-controls',card.id);openButton.onclick=()=>{const wasHidden=card.hidden;for(const other of records.children)other.hidden=true;for(const button of tableRows.querySelectorAll('.row-action'))button.setAttribute('aria-expanded','false');card.hidden=!wasHidden;openButton.setAttribute('aria-expanded',String(wasHidden));if(wasHidden)card.scrollIntoView({block:'nearest',behavior:'smooth'});};actionCell.append(openButton);tableRows.append(tr);
    const title=document.createElement('h2');title.textContent=e.business_name;card.append(title);
    const meta=document.createElement('div');meta.className='meta';meta.textContent='Application #'+e.id+' · '+(e.submitted_at||'')+' · Status: '+(e.application_status||'unknown');card.append(meta);
    const booking=document.createElement('div');booking.className='meta';booking.style.cssText='padding:12px;background:#edf7f0;border-radius:12px';booking.textContent='Reserved/preferred table: '+(e.preferred_table||'Not selected')+' · Assigned table: '+(e.assigned_table||'Not assigned');card.append(booking);
    const tableManager=document.createElement('details');const tableHeading=document.createElement('summary');tableHeading.textContent='Manage table reservation';tableManager.append(tableHeading);
    const tableHelp=document.createElement('p');tableHelp.className='meta';tableHelp.textContent='Reassign to another table number, or release this reservation by cancelling the application. Changes affect live bookings. Review the floor-plan draft after changing a table.';tableManager.append(tableHelp);
    const tableInput=document.createElement('input');tableInput.type='number';tableInput.min='1';tableInput.max='150';tableInput.value=e.assigned_table||e.preferred_table||'';tableInput.setAttribute('aria-label','New table number for '+e.business_name);tableInput.style.width='100px';tableManager.append(tableInput);
    const move=document.createElement('button');move.type='button';move.textContent='Reassign table';const release=document.createElement('button');release.type='button';release.textContent='Release reservation';release.style.marginLeft='8px';const tableResult=document.createElement('p');tableResult.setAttribute('role','status');tableManager.append(move,release,tableResult);
    async function manageTable(mode){const target=Number(tableInput.value);if(mode==='reassign'&&(!Number.isInteger(target)||target<1||target>150)){tableResult.textContent='Enter a valid table number.';return;}
      const question=mode==='release'?'Cancel the application for '+e.business_name+' and release table '+(e.preferred_table||'unknown')+'?':'Move '+e.business_name+' to table '+target+'?';if(!confirm(question))return;
      move.disabled=release.disabled=true;tableResult.textContent='Updating…';try{const r=await fetch(endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify({action:'manage_table',mode,id:Number(e.id),table:target})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'Update failed');await load();notice.textContent='Table reservation updated. Review and save the floor-plan draft if it still shows an old exhibitor name.';}catch(err){tableResult.textContent='Could not update: '+err.message;}finally{move.disabled=release.disabled=false;}}
    move.onclick=()=>manageTable('reassign');release.onclick=()=>manageTable('release');card.append(tableManager);
    const contact=document.createElement('p');contact.className='meta';contact.textContent='Contact: '+(e.contact_name||'Not supplied')+' · Email: '+(e.contact_email||'Not supplied');card.append(contact);
    const details=document.createElement('details');const detailsSummary=document.createElement('summary');detailsSummary.textContent='View application and booking details';details.append(detailsSummary);
    const detailData=e.application_details&&typeof e.application_details==='object'?e.application_details:{};
    const detailList=document.createElement('dl');detailList.style.cssText='display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:8px;overflow-wrap:anywhere';
    const appendDetail=(key,value)=>{if(value===null||value===undefined||value==='')return;const dt=document.createElement('dt');dt.textContent=key.replace(/_/g,' ');dt.style.fontWeight='bold';const dd=document.createElement('dd');dd.style.margin='0';dd.textContent=typeof value==='object'?JSON.stringify(value):String(value);detailList.append(dt,dd);};
    for(const [key,value] of Object.entries(detailData)){if(key==='social_links'||/token|secret|password|csrf|captcha/i.test(key))continue;appendDetail(key,value);}
    if(!detailList.children.length){const empty=document.createElement('p');empty.textContent='No additional booking details recorded.';details.append(empty);}else details.append(detailList);
    card.append(details);
    
    if(e.logo_url&&/^https:\/\//i.test(e.logo_url)){const img=document.createElement('img');img.src=e.logo_url;img.alt='Business logo';img.loading='lazy';card.append(img);}
    if(e.website_url&&/^https:\/\//i.test(e.website_url)){const a=document.createElement('a');a.href=e.website_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Visit business website ↗';card.append(a);}
    const edit=document.createElement('details');edit.setAttribute('data-expo-discovery-form','');const summary=document.createElement('summary');summary.textContent='✎ Edit exhibitor links, logo & details';edit.append(summary);
    const fields={};for(const [key,labelText] of [['business_name','Business name'],['description','Public description'],['website_url','Website URL'],['logo_url','Logo URL'],['facebook_url','Facebook URL'],['instagram_url','Instagram URL'],['tiktok_url','TikTok URL']]){const label=document.createElement('label');label.style.display='block';label.style.margin='10px 0';label.textContent=labelText+' ';const input=key==='description'?document.createElement('textarea'):document.createElement('input');input.value=e[key]||'';input.name=key;input.style.width='100%';input.maxLength=key==='description'?2000:key==='business_name'?150:500;fields[key]=input;label.append(input);edit.append(label);}const lookup=document.createElement('button');lookup.type='button';lookup.setAttribute('data-expo-discover','');lookup.textContent='🔎 Find logo & social links from website';const lookupStatus=document.createElement('p');lookupStatus.setAttribute('data-expo-discovery-status','');lookupStatus.setAttribute('role','status');edit.append(lookup,lookupStatus);const upload=document.createElement('div');upload.setAttribute('data-expo-logo-upload','');upload.innerHTML='<label>Upload logo (PNG, JPEG or WebP, maximum 2 MB) <input type="file" accept="image/png,image/jpeg,image/webp" data-expo-logo-file></label> <button type="button" data-expo-upload-button>Upload logo</button><p data-expo-upload-status role="status"></p><img data-expo-logo-preview alt="Logo preview" hidden>';edit.append(upload);card.append(edit);
    const actions=document.createElement('div');actions.className='actions';
    const status=document.createElement('select');status.setAttribute('aria-label','Approval status for '+e.business_name);
    for(const value of ['pending','approved','rejected','cancelled']){const opt=document.createElement('option');opt.value=value;opt.textContent=value;status.append(opt);}status.value=e.application_status;
    const label=document.createElement('label');const visible=document.createElement('input');visible.type='checkbox';visible.checked=Number(e.public_visible)===1;label.append(visible,document.createTextNode(' Show on public event page'));
    const save=document.createElement('button');save.textContent='Save exhibitor changes';const result=document.createElement('span');result.setAttribute('role','status');
    save.onclick=async()=>{
     if(visible.checked&&status.value!=='approved'){result.textContent='Approve before publishing.';return;}
     save.disabled=true;result.textContent='Saving…';
     try{const r=await fetch(endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify({id:Number(e.id),application_status:status.value,public_visible:visible.checked?1:0,...Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,v.value]))})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'Save failed');result.textContent='Saved.';}catch(err){result.textContent='Could not save: '+err.message;}finally{save.disabled=false;}
    };
    const remove=document.createElement('button');remove.type='button';remove.textContent='Delete exhibitor';remove.style.cssText='background:#9b342a;border-color:#9b342a';remove.onclick=async()=>{const confirmed=window.prompt('PERMANENT DELETE: Type the exact business name to confirm deletion of '+e.business_name+':');if(confirmed===null)return;if(confirmed!==e.business_name){result.textContent='Deletion cancelled: business name did not match.';return;}remove.disabled=true;result.textContent='Deleting…';try{const r=await fetch(endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify({action:'delete',id:Number(e.id),confirm_business_name:confirmed})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Delete failed');card.remove();result.textContent='Deleted.';notice.textContent='Exhibitor deleted. Refresh to update count.';}catch(err){result.textContent='Delete failed: '+err.message;remove.disabled=false;}};actions.append(status,label,save,remove,result);card.append(actions);records.append(card);
   }
   filterRows();
  }catch(error){notice.textContent=error.message;notice.className='error';}
 }await load();
})();
</script><script src="/assets/js/expo-website-discovery.js" defer></script><script src="/assets/js/expo-logo-upload.js" defer></script></body></html>
