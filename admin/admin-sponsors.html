<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event sponsors · Bubba Hub Admin</title><link rel="stylesheet" href="/assets/css/styles.css"><style>body{font-family:Quicksand,Arial,sans-serif;background:#f4faf5;color:#184e3a}.wrap{max-width:1100px;margin:30px auto;padding:20px}.panel{background:white;border-radius:18px;border:1px solid #d2e5d7;padding:24px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.item{border:1px solid #d4e6d9;border-radius:14px;padding:16px}.item p{overflow-wrap:anywhere}.paid{color:#126746;font-weight:bold}.pending{color:#9a5d00;font-weight:bold}</style></head><body><main class="wrap" id="main" hidden><p><a href="/admin/admin-events.html">← Events management</a></p><h1>Event sponsorship payments</h1><p>Payments are checked directly with Stripe. Only completed paid sessions should be treated as paid sponsorships. Recognition is reviewed separately.</p><div class="panel"><p id="status" role="status">Loading Stripe sponsorship payments…</p><div class="list" id="items"></div></div></main><p id="checking" class="wrap">Checking admin access…</p><script>(async()=>{const checking=document.getElementById('checking'),main=document.getElementById('main'),status=document.getElementById('status'),items=document.getElementById('items');try{const a=await fetch('/admin-auth.php?action=check',{credentials:'same-origin',cache:'no-store'});const j=await a.json();if(!a.ok||j.ok!==true){location.replace('/admin-login.html');return}checking.remove();main.hidden=false;const r=await fetch('/api/sponsor-admin.php',{credentials:'same-origin',cache:'no-store'});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(_){throw Error('Server returned a non-JSON response (HTTP '+r.status+'). Check the PHP error log and deployment.')}if(!r.ok||!d.ok)throw Error(d.error||'unavailable');status.textContent=d.sponsors.length+' sponsorship checkout session(s) found in latest Stripe results.'+(d.has_more?' More Stripe sessions exist; older payments may not appear here.':'');for(const s of d.sponsors){const box=document.createElement('div');box.className='item';const h=document.createElement('h3');h.textContent=s.business_name||'Unnamed business';box.appendChild(h);for(const [label,value] of [['Event',s.event_key],['Package','£'+s.tier],['Contact',s.contact_name],['Email',s.email],['Paid amount','£'+(s.amount_total/100).toFixed(2)],['Stripe status',s.payment_status],['Date',new Date(s.created*1000).toLocaleString('en-GB')]]){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=label+': ';p.appendChild(b);p.appendChild(document.createTextNode(value));if(label==='Stripe status')p.className=s.payment_status==='paid'?'paid':'pending';box.appendChild(p)}items.appendChild(box)}}catch(e){checking.hidden=true;main.hidden=false;status.textContent='Unable to load sponsorship payments: '+e.message}})();</script></body></html>
