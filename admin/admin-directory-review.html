<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Directory review · Bubba Hub Admin</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/admin-settings.css"><style>.dr-shell{max-width:1100px;margin:28px auto;padding:0 18px}.dr-panel{background:#fff;border:1px solid #d8e6db;border-radius:14px;padding:20px;margin:16px 0}.dr-item{padding:16px 0;border-bottom:1px solid #e5ece7}.dr-meta{color:#64756e;font-size:14px}.dr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dr-actions input{flex:1;min-width:220px;padding:10px;border:1px solid #cbded9;border-radius:9px}</style></head><body class="bh-admin-v2"><header class="site-header"><a class="brand" href="/"><img class="brand-logo" src="/wp-content/uploads/logo/logoheader.png" alt="Bubba Hub"></a><nav class="main-nav"><a href="/admin/">Admin dashboard</a><a href="/admin/admin-approval-centre.html">Approval Centre</a></nav></header><main class="dr-shell" id="content" hidden><p><a href="/admin/admin-approval-centre.html">← Approval Centre</a></p><h1>Directory section review</h1><p>Review submissions from Businesses, Childcare &amp; Schools, Places &amp; Days Out and School Clubs. Only approved entries appear publicly.</p><section class="dr-panel"><p id="status" role="status">Loading…</p><div id="records"></div></section></main><p class="dr-shell" id="checking">Checking admin access…</p><script>
(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let csrf="";async function load(){try{const r=await fetch("/api/admin-directory-review.php",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||d.error||"Could not load review queue.");csrf=d.csrf;$("status").textContent=d.records.length?d.records.length+" submissions awaiting review":"No submissions awaiting review.";$("records").innerHTML=d.records.map(x=>'<article class="dr-item"><div class="dr-meta">'+esc(x.section.replace("_"," "))+' · #'+x.id+' · '+esc(x.status)+' · '+esc(x.town||"Location not set")+'</div><h2>'+esc(x.title)+'</h2><p><strong>'+esc(x.category||"")+'</strong></p><p>'+esc(x.summary||x.description||"")+'</p><details><summary>Full description</summary><p>'+esc(x.description||"")+'</p></details><div class="dr-actions"><input id="note-'+x.section+'-'+x.id+'" maxlength="2000" placeholder="Optional note to Leader"><button class="button button-primary" data-section="'+x.section+'" data-id="'+x.id+'" data-decision="approved">Approve</button><button class="button button-soft" data-section="'+x.section+'" data-id="'+x.id+'" data-decision="returned_for_edits">Return for edits</button><button class="button button-soft" data-section="'+x.section+'" data-id="'+x.id+'" data-decision="rejected">Reject</button></div></article>').join("");$("records").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>review(b));}catch(e){$("status").textContent=e.message}}async function review(b){b.disabled=true;const section=b.dataset.section,id=b.dataset.id,note=$("note-"+section+"-"+id).value;try{const r=await fetch("/api/admin-directory-review.php",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf,section,record_id:id,decision:b.dataset.decision,note})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||d.error||"Could not save review.");await load()}catch(e){$("status").textContent=e.message;b.disabled=false}}(async()=>{try{const r=await fetch("/admin-auth.php?action=check",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||d.ok!==true){location.replace("/admin-login.html");return;}$("checking").remove();$("content").hidden=false;load()}catch(e){$("checking").textContent="Admin authentication unavailable."}})()})();
</script></body></html>
