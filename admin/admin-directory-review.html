<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Directory review · Bubba Hub Admin</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/admin-settings.css"><style>.dr-shell{max-width:1100px;margin:28px auto;padding:0 18px}.dr-panel{background:#fff;border:1px solid #d8e6db;border-radius:14px;padding:20px;margin:16px 0}.dr-item{padding:16px 0;border-bottom:1px solid #e5ece7}.dr-meta{color:#64756e;font-size:14px}.dr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dr-actions input{flex:1;min-width:220px;padding:10px;border:1px solid #cbded9;border-radius:9px}.dr-change{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.dr-change>div{background:#f4f8f7;padding:12px;border-radius:9px;overflow-wrap:anywhere}.dr-change strong{display:block;color:#174e3b;margin-bottom:5px}@media(max-width:650px){.dr-change{grid-template-columns:1fr}}</style></head><body class="bh-admin-v2"><header class="site-header"><a class="brand" href="/"><img class="brand-logo" src="/wp-content/uploads/logo/logoheader.png" alt="Bubba Hub"></a><nav class="main-nav"><a href="/admin/">Admin dashboard</a><a href="/admin/admin-approval-centre.html">Approval Centre</a></nav></header><main class="dr-shell" id="content" hidden><p><a href="/admin/admin-approval-centre.html">← Approval Centre</a></p><h1>Directory section review</h1><p>Review new submissions and requested changes. Published entries change only when a revision is approved.</p><section class="dr-panel"><p id="status" role="status">Loading…</p><div id="records"></div></section></main><p class="dr-shell" id="checking">Checking admin access…</p><script>
(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let csrf="";
function eventDates(rows){return (rows||[]).map(x=>[x.starts_at,x.ends_at].filter(Boolean).join(" – ")).join("\n")||"No dates";}
async function load(){try{const r=await fetch("/api/admin-directory-review.php",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||d.error||"Could not load review queue.");csrf=d.csrf;const records=d.records||[];$("status").textContent=records.length?records.length+" items awaiting review":"No items awaiting review."; $("records").innerHTML=records.map(x=>{const isRev=x.kind==="revision",key=x.kind+"-"+x.section+"-"+(x.revision_id||x.id),proposed=x.proposed||{},changed=Object.keys(proposed).filter(k=>String(proposed[k]??"")!==String(x[k]??""));return '<article class="dr-item"><div class="dr-meta">'+(isRev?"CHANGE REQUEST":"NEW SUBMISSION")+' · '+esc(x.section.replaceAll("_"," "))+' · entry #'+esc(x.record_id||x.id)+'</div><h2>'+esc(x.title)+'</h2><p><strong>'+esc(x.category||"")+'</strong> · '+esc(x.town||"Location not set")+'</p><p>'+esc(x.summary||x.description||"")+'</p>'+(isRev?'<details open><summary>Review proposed changes ('+changed.length+' changed fields)</summary>'+changed.map(k=>'<div class="dr-change"><div><strong>Current: '+esc(k.replaceAll("_"," "))+'</strong>'+esc(x[k]??"—")+'</div><div><strong>Proposed</strong>'+esc(proposed[k]??"—")+'</div></div>').join("")+(x.section==="event"?'<div class="dr-change"><div><strong>Current event dates</strong><pre>'+esc(eventDates(x.current_occurrences))+'</pre></div><div><strong>Proposed event dates</strong><pre>'+esc(eventDates((proposed.occurrences||[]).map(o=>({starts_at:o.start,ends_at:o.end}))))+'</pre></div></div><div class="dr-change"><div><strong>Current linked Listing IDs</strong>'+esc((x.current_listing_ids||[]).join(", ")||"None")+'</div><div><strong>Proposed linked Listing IDs</strong>'+esc((proposed.listing_ids||[]).join(", ")||"None")+'</div></div>':'')+'</details>':'<details><summary>Full description</summary><p>'+esc(x.description||"")+'</p></details>')+'<div class="dr-actions"><input id="note-'+key+'" maxlength="2000" placeholder="Optional note to Leader"><button class="button button-primary" data-kind="'+x.kind+'" data-section="'+x.section+'" data-id="'+(isRev?x.revision_id:x.id)+'" data-decision="approved">Approve</button><button class="button button-soft" data-kind="'+x.kind+'" data-section="'+x.section+'" data-id="'+(isRev?x.revision_id:x.id)+'" data-decision="returned_for_edits">Return for edits</button><button class="button button-soft" data-kind="'+x.kind+'" data-section="'+x.section+'" data-id="'+(isRev?x.revision_id:x.id)+'" data-decision="rejected">Reject</button></div></article>'}).join("");$("records").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>review(b));}catch(e){$("status").textContent=e.message}}
async function review(b){b.disabled=true;const section=b.dataset.section,id=b.dataset.id,kind=b.dataset.kind,note=$("note-"+kind+"-"+section+"-"+id).value;try{const r=await fetch("/api/admin-directory-review.php",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf,kind,section,record_id:id,decision:b.dataset.decision,note})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||d.error||"Could not save review.");await load()}catch(e){$("status").textContent=e.message;b.disabled=false}}
(async()=>{try{const r=await fetch("/admin-auth.php?action=check",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||d.ok!==true){location.replace("/admin-login.html");return;}$("checking").remove();$("content").hidden=false;load()}catch(e){$("checking").textContent="Admin authentication unavailable."}})();
})();
</script></body></html>
