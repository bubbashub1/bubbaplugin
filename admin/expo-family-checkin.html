<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Expo Family Check-in | Bubba Hub</title>
<style>:root{font-family:system-ui,sans-serif;background:#eff8f1;color:#164735}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:620px;margin:auto}header{background:#d9f4e0;padding:24px;border-radius:24px}.card{background:white;padding:24px;border-radius:22px;margin-top:16px}label{display:block;font-weight:700;margin:15px 0 6px}textarea,input{width:100%;padding:12px;border:2px solid #b8d7c3;border-radius:12px;font:inherit}button{background:#176244;color:white;border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:700;margin-top:15px;cursor:pointer}button:disabled{opacity:.5}#result{padding:15px;background:#e6f1e9;border-radius:12px;margin-top:15px;white-space:pre-line}a{color:#176244}</style></head><body><main><header><h1>👨‍👩‍👧‍👦 Expo Family Check-in</h1><p>9 January 2027 · Acorn Centre, Torquay</p><strong>Staging · Admin only</strong></header><section class="card"><p>Use the booking-level QR text. Record only the people arriving now. Repeat later for other family members.</p><form id="form"><label for="qr">Family booking QR text</label><textarea id="qr" rows="3" required placeholder="BH-EXPO-2027:…"></textarea><label for="adults">Adults arriving now</label><input id="adults" type="number" min="0" max="12" step="1" value="1" required><label for="children">Children arriving now</label><input id="children" type="number" min="0" max="12" step="1" value="0" required><button id="submit" disabled>Record family arrival</button></form><div id="result" role="status" aria-live="polite">Checking admin session…</div></section><p><a href="/admin/expo-checkin.html">← Adult ticket scanner</a></p></main><script>
(()=>{'use strict';let csrf='',busy=false;const $=id=>document.getElementById(id),button=$('submit'),result=$('result');const show=s=>{result.textContent=s};async function init(){try{const r=await fetch('/api/expo-admin-checkin-session.php',{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok||!j.csrf)throw Error();csrf=j.csrf;button.disabled=false;show('Admin verified. Enter a confirmed family booking QR.')}catch{show('Admin login required. Sign in through the dashboard first.')}}$('form').addEventListener('submit',async e=>{e.preventDefault();if(!csrf||busy)return;const qr=$('qr').value.trim(),adults=Number($('adults').value),children=Number($('children').value);if(!/^BH-EXPO-2027:[a-f0-9]{64}$/.test(qr)||!Number.isInteger(adults)||!Number.isInteger(children)||adults<0||children<0||adults+children<1||adults+children>12){show('Enter a valid QR and between 1 and 12 arriving people.');return}busy=true;button.disabled=true;show('Recording arrival…');try{const r=await fetch('/api/expo-admin-family-checkin.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-BH-Admin-CSRF':csrf},body:JSON.stringify({qr_payload:qr,adults,children})});const j=await r.json();if(r.ok&&j.ok){show('✓ Arrival recorded for '+j.reference+'\nAdults: '+j.adults_checked_in+'/'+j.adults_total+'\nChildren: '+j.children_checked_in+'/'+j.children_total);$('adults').value='0';$('children').value='0'}else{show(({exceeds_booking:'Arrival exceeds the remaining booking places.',booking_not_confirmed:'QR is not associated with a confirmed family booking.',invalid_csrf:'Security token expired. Reload this page.',admin_session_expired:'Admin session expired.'})[j.error]||'Unable to record arrival. Check the booking before retrying.');if(j.error==='invalid_csrf'||r.status===401||r.status===403)csrf=''}}catch{show('Network error. Verify whether the arrival was recorded before retrying.')}finally{busy=false;button.disabled=!csrf}});init()})();
</script></body></html>
