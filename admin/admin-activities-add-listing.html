<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add new listing · Admin · Bubba Hub</title><link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="assets/css/admin-settings.css"><link rel="stylesheet" href="/assets/css/admin-support-v2.css"></head><body class="bh-admin-v2"><header class="site-header"><a class="brand" href="index.html"><img class="brand-logo" src="images/logos/mainlogo-20260924-221429-7e305d.jpg" alt="Bubba Hub"></a><nav class="main-nav"><a href="directory.html">Find activities</a><a href="my-hub.html">My Hub</a><a href="leader.html">Class Leaders</a><a href="admin/admin.html">Admin</a></nav><a class="button button-soft" href="account.html">My account</a></header><main class="admin-subpage-shell"><div class="admin-back"><a href="admin-activities.html">← Activities</a></div><div class="admin-subpage-head"><div><span class="eyebrow">Directory</span><h1>Add new listing</h1><p>Create a new activity listing directly in the Bubba Hub database.</p></div><button class="button button-soft" data-admin-logout>Sign out of admin</button></div><section class="admin-panel"><form id="newListingForm" class="admin-form"><div class="admin-form-grid"><label>Activity title<input name="title" required></label><label>Category<input name="category" required placeholder="Baby classes"></label><label>Organisation<input name="organisation_name" required></label><label>Venue name<input name="venue_name" required></label><label>Village, Town or City<input name="town" required></label><label>County / Area<select name="county"><option value="">Select county / area</option><option>Devon</option><option>Cornwall</option><option>Plymouth</option><option>Torbay</option></select></label><label>Region<input name="region"></label><label>Postcode<input name="postcode"></label><label>Price from (£)<input name="price_from" type="number" step="0.01" min="0"></label><label>Status<select name="status"><option value="published">Published</option><option value="draft">Draft</option></select></label><label class="admin-form-wide">Description<textarea name="description" rows="5"></textarea></label><label>Booking URL<input name="booking_url" type="url" placeholder="https://"></label><label>Email<input name="email" type="email"></label><label>Phone<input name="phone"></label><label>Website<input name="website" type="url" placeholder="https://"></label><label class="admin-form-wide">Address<input name="address"></label><label>Image path / URL<input name="image_path" placeholder="/beta/library/listings/image.jpg"></label><label>Age range<input name="age_range" placeholder="0 - 5 years"></label></div><div class="hero-actions"><button class="button button-primary" type="submit">Save listing</button><a class="button button-soft" href="admin-activities-listings.html">Cancel</a></div><p class="library-message" id="newListingStatus" role="status"></p></form></section></main><footer class="site-footer"><div class="site-footer-bottom"><span>© 2026 Bubba Hub</span><span>Devon &amp; Cornwall</span></div></footer><script src="assets/js/admin-new-listing.js"></script><script src="assets/js/admin-settings.js"></script></body></html>
