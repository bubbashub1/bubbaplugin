<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add new listing · Admin · Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/admin-settings.css"><link rel="stylesheet" href="/assets/css/admin-support-v2.css"><link rel="stylesheet" href="/assets/css/subpages-v2.css"></head><body class="bh-admin-v2"><header class="site-header"><a class="brand" href="/index.html"><img class="brand-logo" src="/wp-content/uploads/logo/logoheader.png" alt="Bubba Hub"></a><nav class="main-nav"><a href="/directory.html">Find activities</a><a href="/my-hub.html">My Hub</a><a href="/leader.html">Class Leaders</a><a href="/admin/">Admin</a></nav><a class="button button-soft" href="/account.html">My account</a></header><main class="admin-subpage-shell bh-new"><div class="admin-back"><a href="/admin/admin-activities.html">← Activities</a></div><div class="admin-subpage-head"><div><span class="eyebrow">Directory</span><h1>Add new listing</h1><p>Create or edit a listing in simple steps, following the class leader format.</p></div><button class="button button-soft" data-admin-logout>Sign out of admin</button></div><section class="admin-panel bh-card"><nav class="bh-steps" id="adminListingSteps" aria-label="Listing sections"></nav><form id="newListingForm" class="admin-form"><div class="admin-form-grid"><label>Activity title<input name="title" required></label><label>Category<input name="category" required placeholder="Baby classes"></label><label>Organisation<input name="organisation_name" required></label><label>Venue name<input name="venue_name" required></label><label>Village, Town or City<input name="town" required></label><label>County / Area<select name="county"><option value="">Select county / area</option><option>Devon</option><option>Cornwall</option><option>Plymouth</option><option>Torbay</option></select></label><label>Region<input name="region"></label><label>Postcode<input name="postcode"></label><label>Price (£)<input name="price_from" type="number" step="0.01" min="0"></label><label>Pricing unit<select name="pricing_unit"><option value="per_session">Per Session</option><option value="per_block">Per Block</option><option value="per_family">Per Family</option></select></label><label>Is free? <input name="price_free" type="checkbox" value="1"></label><label>Status<select name="status"><option value="published">Published</option><option value="draft">Draft</option></select></label><label class="admin-form-wide">Description<textarea name="description" rows="5"></textarea></label><label>Booking URL<input name="booking_url" type="url" placeholder="https://"></label><label>Email<input name="email" type="email"></label><label>Phone<input name="phone"></label><label>Website<input name="website" type="url" placeholder="https://"></label><label class="admin-form-wide">Address<input name="address"></label><label>Image path / URL<input name="image_path" placeholder="/beta/library/listings/image.jpg"></label><label>Age range preset<select name="age_preset"><option value="">Choose age range</option><option value="0-6">👶 Newborn &amp; Pre-Crawlers (0–6 months)</option><option value="6-12">🧸 Babies &amp; Sitters (6–12 months)</option><option value="0-12" selected>🍼 Pre-Walking / All Babies (0–12 months)</option><option value="12-48">👟 Toddlers &amp; Pre-School (1–4 years)</option><option value="48+">🎒 Early Years &amp; Older (4+ years)</option></select></label><label>Age range (display)<input name="age_range" placeholder="0–12 months"></label><input type="hidden" name="age_min_months"><input type="hidden" name="age_max_months"></div><div class="hero-actions"><button type="button" class="button button-soft" id="adminListingBack" hidden>← Back</button><button type="button" class="button button-primary" id="adminListingNext">Continue →</button><button class="button button-primary" type="submit" id="adminListingSubmit" hidden>Save listing</button><a class="button button-soft" href="/admin/admin-activities-listings.html">Cancel</a></div><p class="library-message" id="newListingStatus" role="status"></p></form></section></main><footer class="site-footer"><div class="site-footer-bottom"><span>© 2026 Bubba Hub</span><span>Devon &amp; Cornwall</span></div></footer><script src="/assets/js/admin-new-listing.js"></script><script src="/assets/js/admin-settings.js"></script></body></html>
