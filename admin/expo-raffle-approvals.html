<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expo prize donation approvals · Bubba Hub</title><style>body{font:16px system-ui;background:#f3faf4;color:#174b33}main{max-width:960px;margin:auto;padding:20px}article{background:#fff;border:1px solid #d6e5d9;border-radius:18px;padding:20px;margin:14px 0}h1{font-size:clamp(1.5rem,5vw,2.4rem)}button{padding:12px 16px;border:0;border-radius:12px;background:#17644d;color:white;font:inherit;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#eee;color:#174b33}button:disabled{opacity:.5}textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #9ca}img{max-width:180px;max-height:160px;object-fit:cover;border-radius:12px}small{color:#566}article p{overflow-wrap:anywhere}</style></head><body><main><a href="/admin/expo-raffle-prizes.html">← Prize manager</a><h1>🎁 Class Leader prize approvals</h1><p>Approved donations are added to the prize manager as <strong>drafts</strong>. You must publish them separately before they appear on the Expo page.</p><p id="status" role="status">Checking admin access…</p><div id="submissions"></div></main><script>
const api='/api/expo-raffle-admin.php',out=document.getElementById('submissions'),status=document.getElementById('status');let csrf='';
function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
async function load(){try{const r=await fetch(api+'?view=submissions',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Unavailable');csrf=d.csrf;out.replaceChildren();status.textContent=d.submissions.length?d.submissions.length+' submission(s)':'No prize donations submitted yet.';for(const s of d.submissions){const card=document.createElement('article');card.append(el('h2',s.title),el('p','Donated by: '+(s.organiser_name||'Class Leader')+' · '+s.status));if(s.description)card.append(el('p',s.description));if(s.prize_value)card.append(el('p','Estimated value: '+s.prize_value));if(s.redemption_terms)card.append(el('p','Terms: '+s.redemption_terms));if(s.fulfilment_contact)card.append(el('p','Private fulfilment contact: '+s.fulfilment_contact));if(s.image_url&&/^https:\/\//i.test(s.image_url)){const img=document.createElement('img');img.src=s.image_url;img.alt='Prize photo';img.onerror=()=>img.remove();card.append(img);}if(s.review_note)card.append(el('p','Review note: '+s.review_note));if(['pending','changes_requested'].includes(s.status)){const note=document.createElement('textarea');note.rows=2;note.placeholder='Reason or instructions to the Class Leader';note.setAttribute('aria-label','Review note for '+s.title);card.append(note);for(const [decision,label] of [['approved','Approve as draft'],['changes_requested','Request changes'],['rejected','Reject']]){const btn=el('button',label);btn.type='button';if(decision!=='approved')btn.className='secondary';btn.onclick=async()=>{if(decision!=='approved'&&!note.value.trim()){status.textContent='Please enter a review note first.';note.focus();return;}if(!confirm(label+' — '+s.title+'?'))return;btn.disabled=true;try{const r=await fetch(api,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({action:'review_submission',submission_id:s.id,decision,review_note:note.value.trim()})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Review failed');await load();status.textContent='Review saved. Approved prizes remain drafts until published.';}catch(e){status.textContent='Unable to review: '+e.message;btn.disabled=false;}};card.append(btn);}}out.append(card);}}catch(e){status.textContent='Unable to load submissions: '+e.message;}}
load();
</script></body></html>
