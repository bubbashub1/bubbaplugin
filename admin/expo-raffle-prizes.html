<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expo raffle prize manager · Bubba Hub</title><style>body{font:16px system-ui;background:#f3faf4;color:#174b33;margin:0}main{max-width:950px;margin:auto;padding:22px}h1{color:#145b4e}form,.item{background:white;border:1px solid #c9e4d1;border-radius:18px;padding:20px;margin:16px 0}label{display:block;margin:12px 0;font-weight:600}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:11px;border:1px solid #9fbaaa;border-radius:10px;font:inherit}button{background:#17644d;color:white;border:0;border-radius:12px;padding:12px 18px;font:inherit;cursor:pointer;margin:6px 6px 6px 0}button:focus-visible,a:focus-visible{outline:3px solid #f28a38}#status{min-height:1.5em}small{color:#50685c}</style></head><body><main><a href="/expo.html">← Expo page</a><h1>🎁 Expo raffle prize manager</h1><p>Only published prizes appear publicly. Upload images to your existing media library and paste their HTTPS URL below. Ticket checkout is not enabled here.</p><p id="status" role="status">Checking admin access…</p><form id="editor" hidden><input type="hidden" name="id"><label>Prize title<input name="title" maxlength="160" required></label><label>Description<textarea name="description" maxlength="3000" rows="3"></textarea></label><label>Image HTTPS URL<input name="image_url" type="url"></label><label>Donated by<input name="donor_name" maxlength="160"></label><label>Donor website HTTPS URL<input name="donor_url" type="url"></label><label>Approximate value (optional)<input name="prize_value" maxlength="60"></label><label>Entry type<select name="entry_type"><option value="raffle">Raffle</option><option value="giveaway">Free giveaway</option></select></label><label>Visibility<select name="status"><option value="draft">Draft</option><option value="published">Published</option><option value="claimed">Claimed / hidden</option></select></label><label>Display order<input name="sort_order" type="number" value="0" min="-10000" max="10000"></label><button type="submit">Save prize</button><button type="button" id="clear">Add another prize</button></form><h2>Saved prizes</h2><div id="items"></div></main><script>
const api='/api/expo-raffle-admin.php',form=document.getElementById('editor'),status=document.getElementById('status'),items=document.getElementById('items');let csrf='',prizes=[];
function edit(p){for(const field of form.elements){if(field.name)field.value=p[field.name]??(field.name==='sort_order'?'0':'');}form.scrollIntoView({behavior:'smooth'});}
function draw(){items.replaceChildren();for(const p of prizes){const el=document.createElement('div');el.className='item';const h=document.createElement('h3');h.textContent=p.title;const t=document.createElement('p');t.textContent=(p.status||'draft')+' · '+(p.entry_type||'raffle')+' · '+(p.donor_name||'No donor');const b=document.createElement('button');b.textContent='Edit';b.addEventListener('click',()=>edit(p));el.append(h,t,b);items.append(el);}}
async function load(){try{const r=await fetch(api,{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Unable to load');csrf=d.csrf;prizes=d.prizes;form.hidden=false;status.textContent='Admin access confirmed';draw();}catch(e){status.textContent='Unable to open prize manager: '+e.message;}}
document.getElementById('clear').onclick=()=>{form.reset();form.elements.id.value='';};
form.addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(form));status.textContent='Saving…';try{const r=await fetch(api,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(v)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Save failed');form.reset();form.elements.id.value='';await load();status.textContent='Prize saved';}catch(err){status.textContent='Unable to save: '+err.message;}});load();
</script></body></html>
