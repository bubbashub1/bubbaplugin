<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expo Test Tickets | Bubba Hub</title><style>body{font:16px system-ui;background:#edf7f0;color:#174b38;padding:20px}main{max-width:650px;margin:auto;background:white;border-radius:22px;padding:24px}button{background:#186344;color:white;border:0;border-radius:12px;padding:13px 18px;font:inherit;cursor:pointer;margin:8px 6px 8px 0}button:disabled{opacity:.5}input{width:70px;padding:8px}label{display:inline-block;margin:12px 20px 12px 0}textarea{width:100%;box-sizing:border-box;min-height:90px;overflow-wrap:anywhere}section{padding:12px;background:#eef7f1;border-radius:14px;margin:12px 0}#status{font-weight:bold}</style></head><body><main><h1>Expo staging test tickets</h1><p><strong>Admin only.</strong> Creates a dummy confirmed booking and adult QR payloads for testing the scanner. No visitor emails are sent. These are not valid event admissions.</p><label>Adults <input id="adults" type="number" min="1" max="4" value="2"></label><label>Children <input id="children" type="number" min="0" max="8" value="1"></label><p><button id="create" disabled>Create test reservation</button></p><div id="status" role="status">Checking admin session…</div><section id="results" hidden><p id="reference"></p><div id="tickets"></div><p><a href="/admin/expo-checkin.html">Open check-in scanner</a></p><button id="cleanup">Delete this test reservation</button></section></main><script>
(async()=>{'use strict';let csrf='',fixtureId=0;const status=document.getElementById('status'),create=document.getElementById('create'),cleanup=document.getElementById('cleanup'),results=document.getElementById('results'),tickets=document.getElementById('tickets');
try{const r=await fetch('/api/expo-admin-checkin-session.php',{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error('Sign in to staging admin first.');csrf=j.csrf;create.disabled=false;status.textContent='Ready to create a staging test.'}catch(e){status.textContent=e.message;return}
async function request(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-BH-Admin-CSRF':csrf},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
create.addEventListener('click',async()=>{create.disabled=true;status.textContent='Creating test reservation…';try{const j=await request('/api/expo-admin-test-fixture.php',{confirm:'CREATE_STAGING_TEST',adults:Number(document.getElementById('adults').value),children:Number(document.getElementById('children').value)});fixtureId=j.reservation_id;document.getElementById('reference').textContent='Test reference: '+j.reference;tickets.replaceChildren();j.qr_payloads.forEach((p,i)=>{const label=document.createElement('p');label.textContent='Adult '+(i+1)+' — copy the QR text into the scanner:';const field=document.createElement('textarea');field.readOnly=true;field.value=p;const copy=document.createElement('button');copy.textContent='Copy adult '+(i+1);copy.addEventListener('click',()=>navigator.clipboard.writeText(p));tickets.append(label,field,copy)});results.hidden=false;status.textContent='Test reservation created. No email sent.'}catch(e){status.textContent=e.message}finally{create.disabled=false}});
cleanup.addEventListener('click',async()=>{if(!fixtureId||!confirm('Delete this staging test reservation and its tickets?'))return;cleanup.disabled=true;try{await request('/api/expo-admin-test-cleanup.php',{confirm:'DELETE_STAGING_TEST',reservation_id:fixtureId});fixtureId=0;results.hidden=true;tickets.replaceChildren();status.textContent='Test reservation deleted.'}catch(e){status.textContent=e.message}finally{cleanup.disabled=false}});
})();
</script></body></html>
