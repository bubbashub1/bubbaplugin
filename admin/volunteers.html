<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer applications · Bubba Hub Admin</title><link rel="stylesheet" href="/assets/css/styles.css"><style>main{max-width:1100px;margin:30px auto;padding:20px;font-family:Quicksand,Arial,sans-serif}h1{color:#20553f}.application{background:#fff;border:1px solid #d6e6da;border-radius:18px;padding:20px;margin:15px 0}.application p{overflow-wrap:anywhere}.application button{padding:10px 16px;border-radius:14px;border:1px solid #8ab19a;margin:5px;cursor:pointer}.application button:disabled{opacity:.5}</style></head><body><main><p><a href="/admin">← Admin dashboard</a></p><h1>Volunteer applications</h1><p>Review applications before assigning access. Approving an application does not automatically create an account.</p><section class="application"><h2>Assign volunteer regions</h2><p>Only assign regions to active Bubba Hub accounts. Approval alone does not grant access.</p><form id="assign-form"><label>User ID <input name="user_id" type="number" min="1" required></label> <label>Region <input name="region" maxlength="120" required placeholder="e.g. Torbay"></label> <label><input name="active" type="checkbox" checked> Active</label> <button type="submit">Save assignment</button></form><p id="assignment-status" role="status"></p><div id="assignments"></div></section><div id="applications" role="region" aria-live="polite">Loading applications…</div><p id="status" role="status"></p></main><script>
(async()=>{const list=document.getElementById('applications'),status=document.getElementById('status');let csrf='';const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=String(text??'');return e};try{const auth=await fetch('/api/auth.php?action=me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json());if(!auth.is_admin){list.textContent='Admin access required.';return}csrf=auth.csrf||'';
const assignmentForm=document.getElementById('assign-form'),assignmentStatus=document.getElementById('assignment-status'),assignments=document.getElementById('assignments');
async function loadAssignments(){const r=await fetch('/api/admin-volunteer-assignments.php',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('Unable to load region assignments');const j=await r.json();assignments.replaceChildren();for(const a of j.assignments||[]){assignments.append(el('p','User #'+a.user_id+' ('+a.email+') — '+a.region+' — '+(Number(a.is_active)?'Active':'Inactive')))}if(!j.assignments?.length)assignments.textContent='No regions assigned yet.'}
assignmentForm.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(assignmentForm);assignmentStatus.textContent='Saving…';try{const r=await fetch('/api/admin-volunteer-assignments.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({csrf,user_id:Number(f.get('user_id')),region:String(f.get('region')).trim(),active:f.get('active')==='on'})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Save failed');assignmentStatus.textContent='Assignment saved.';await loadAssignments()}catch(err){assignmentStatus.textContent=err.message}});
try{await loadAssignments()}catch(err){assignmentStatus.textContent=err.message}
const res=await fetch('/api/admin-volunteers.php',{credentials:'same-origin',cache:'no-store'});if(!res.ok)throw Error('Unable to load applications');const data=await res.json();list.replaceChildren();if(!data.applications.length){list.textContent='No applications yet.';return}for(const a of data.applications){const card=el('article','');card.className='application';card.append(el('h2',a.name+' — '+a.preferred_role),el('p','Email: '+a.email),el('p','Area: '+[a.town,a.region].filter(Boolean).join(', ')),el('p','Availability: '+a.availability),el('p','Motivation: '+a.motivation));const current=el('strong','Status: '+a.status);card.append(current);for(const s of ['approved','declined','pending']){const b=el('button',s==='approved'?'Approve':s==='declined'?'Decline':'Mark pending');b.type='button';b.disabled=a.status===s;b.onclick=async()=>{b.disabled=true;status.textContent='Saving…';try{const r=await fetch('/api/admin-volunteers.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:a.id,status:s,csrf})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Save failed');a.status=s;current.textContent='Status: '+s;card.querySelectorAll('button').forEach(x=>x.disabled=x.textContent.toLowerCase().includes(s==='approved'?'approve':s==='declined'?'decline':'pending'));status.textContent='Application updated.'}catch(e){status.textContent=e.message;b.disabled=false}};card.append(b)}list.append(card)}}catch(e){list.textContent=e.message}})();
</script></body></html>
