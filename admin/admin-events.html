<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events review · Bubba Hub Admin</title><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/admin-settings.css"><style>.ev-shell{max-width:1100px;margin:30px auto;padding:0 18px}.ev-panel{background:#fff;border:1px solid #d6e1d8;border-radius:14px;padding:20px;margin:16px 0}.ev-item{padding:16px 0;border-bottom:1px solid #e5ece7}.ev-item:last-child{border:0}.ev-meta{color:#64756e;font-size:14px}.ev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ev-actions input{flex:1;min-width:220px;padding:10px;border:1px solid #cbded9;border-radius:9px}.ev-status{padding:12px 0}</style></head><body class="bh-admin-v2"><header class="site-header"><a class="brand" href="/"><img class="brand-logo" src="/wp-content/uploads/logo/logoheader.png" alt="Bubba Hub"></a><nav class="main-nav"><a href="/admin/">Admin dashboard</a><a href="/admin/admin-approval-centre.html">Approval Centre</a></nav></header><main class="ev-shell" id="content" hidden><p><a href="/admin/admin-approval-centre.html">← Approval Centre</a></p><h1>Events review</h1><p>Check event details before publication. Only approved events appear in the public Events directory.</p><section class="ev-panel"><div id="eventReviewStatus" class="ev-status" role="status">Loading event submissions…</div><div id="eventReviewList"></div></section></main><p id="checking" class="ev-shell">Checking admin access…</p><script>
(()=>{const status=document.getElementById("eventReviewStatus"),list=document.getElementById("eventReviewList");let csrf="";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){try{const r=await fetch("/api/admin-events-review.php",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||d.error||"Unable to load event submissions.");csrf=d.csrf;status.textContent=d.events.length?d.events.length+" event(s) awaiting review":"No event submissions to review.";list.innerHTML=d.events.map(e=>'<article class="ev-item"><div class="ev-meta">#'+e.id+' · '+esc(e.status)+' · '+esc(e.organisation_name||"Organiser")+'</div><h2>'+esc(e.title)+'</h2><p>'+esc(e.summary||e.description||"")+'</p><p><strong>Date:</strong> '+esc(e.starts_at||"Not set")+' '+(e.ends_at?'– '+esc(e.ends_at):'')+'<br><strong>Venue:</strong> '+esc([e.venue_name,e.town,e.region].filter(Boolean).join(", "))+'</p><details><summary>Full description</summary><p>'+esc(e.description||"")+'</p></details><label for="note-'+e.id+'">Review note</label><div class="ev-actions"><input id="note-'+e.id+'" maxlength="2000" placeholder="Optional note to organiser"><button class="button button-primary" data-id="'+e.id+'" data-decision="approved">Approve</button><button class="button button-soft" data-id="'+e.id+'" data-decision="returned_for_edits">Return for edits</button><button class="button button-soft" data-id="'+e.id+'" data-decision="rejected">Reject</button></div></article>').join("");list.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>review(+b.dataset.id,b.dataset.decision,b));}catch(e){status.textContent=e.message}}
async function review(id,decision,button){const note=document.getElementById("note-"+id).value;button.disabled=true;try{const r=await fetch("/api/admin-events-review.php",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf,event_id:id,decision,note})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||d.error||"Review could not be saved.");await load()}catch(e){status.textContent=e.message;button.disabled=false}}
(async()=>{try{const r=await fetch("/admin-auth.php?action=check",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||d.ok!==true){location.replace("/admin-login.html");return;}document.getElementById("checking").remove();document.getElementById("content").hidden=false;load()}catch(e){document.getElementById("checking").textContent="Admin authentication unavailable.";}})();
})();
</script></body></html>
