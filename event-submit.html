<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post an event | Bubba Hub</title><link rel="stylesheet" href="/styles.css"><style>body{font-family:Quicksand,Calibri,sans-serif;background:#f5f8f4;color:#144400}.wrap{max-width:700px;margin:35px auto;padding:18px}.panel{background:white;border-radius:20px;padding:25px}label{display:block;margin:15px 0 5px}input,textarea,select{width:100%;padding:12px;box-sizing:border-box;border:1px solid #9fb7a5;border-radius:10px}button{padding:12px 22px;border:0;border-radius:25px;background:#144400;color:white;margin-top:15px}button:disabled{opacity:.5}</style></head><body><main class="wrap"><a href="/events.html">← Events</a><div class="panel"><h1>Post your event</h1><p id="stepTitle">Step 1 of 5: Event link</p><form id="wizard"><section data-step="0"><label>Public event website URL (optional)<input name="source_url" type="url" placeholder="https://example.com/event"></label><button type="button" id="import">Import event details</button><p id="importStatus" role="status"></p></section><section data-step="1" hidden><label>Event title<input name="title" required maxlength="180"></label><label>Description<textarea name="description" rows="5" required></textarea></label><label>Category<input name="category" placeholder="Family, baby, pregnancy..."></label></section><section data-step="2" hidden><label>Starts<input name="starts_at" type="datetime-local" required></label><label>Ends<input name="ends_at" type="datetime-local" required></label><label>Venue / location<input name="location" required></label></section><section data-step="3" hidden><label>Booking option<select name="booking_mode"><option value="external">External booking link</option><option value="none">No booking needed</option><option value="free">Request free reservations</option></select></label><label>Booking link (if external)<input name="booking_url" type="url"></label><label>Contact email<input name="contact_email" type="email" required></label></section><section data-step="4" hidden><h2>Review and submit</h2><pre id="review" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p>Events are reviewed before appearing publicly.</p></section><div><button type="button" id="back" hidden>Back</button> <button type="button" id="next">Continue →</button><button type="submit" id="submit" hidden>Submit for review</button></div><p id="message" role="status"></p></form></div></main><script>const form=document.getElementById('wizard'),sections=[...document.querySelectorAll('[data-step]')],titles=['Event link','Event details','Date & venue','Booking','Review'];let step=0;function render(){sections.forEach((s,i)=>s.hidden=i!==step);document.getElementById('stepTitle').textContent='Step '+(step+1)+' of 5: '+titles[step];back.hidden=step===0;next.hidden=step===4;submit.hidden=step!==4;if(step===4){let d=new FormData(form);review.textContent=['title','description','starts_at','ends_at','location','booking_mode','booking_url','contact_email'].map(k=>k+': '+(d.get(k)||'')).join('\n')}}const back=document.getElementById('back'),next=document.getElementById('next'),submit=document.getElementById('submit');back.onclick=()=>{step--;render()};next.onclick=()=>{if(step===1||step===2||step===3){for(let el of sections[step].querySelectorAll('[required]'))if(!el.reportValidity())return}step++;render()};document.getElementById('import').onclick=async()=>{let url=form.elements.source_url.value;if(!url)return;importStatus.textContent='Checking public event details…';try{let r=await fetch('/api/events.php?action=import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})}),d=await r.json();if(!d.ok)throw Error(d.error||'Import unavailable');for(let k of ['title','description','starts_at','ends_at','location'])if(d.event[k])form.elements[k].value=d.event[k];importStatus.textContent='Details imported. Please check all fields.'}catch(e){importStatus.textContent=e.message+'. You can enter details manually.'}};form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{let data=Object.fromEntries(new FormData(form));let r=await fetch('/api/events.php?action=submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json();if(!d.ok)throw Error(d.error||'Submission failed');message.textContent='Event submitted for review. Thank you!';form.reset()}catch(e){message.textContent=e.message}finally{submit.disabled=false}};render()</script></body></html>
