<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer Hub | Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css"><style>main{max-width:1050px;margin:40px auto;padding:20px;font-family:Quicksand,Arial,sans-serif}.hero{padding:30px;border-radius:25px;background:linear-gradient(120deg,#e1f3e6,#fff0dd)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:25px}.card{border:1px solid #d9e8dc;border-radius:20px;padding:20px;background:#fff}.card p{color:#4a6d5b}a{color:#17684f}</style></head><body><header class="site-header"><a class="brand" href="/"><img class="brand-logo" src="/wp-content/uploads/logo/logoheader.png" alt="Bubba Hub"></a></header><main><section class="hero"><p>Community volunteers</p><h1>My Volunteer Hub 💚</h1><p>See the areas and listings you're helping to look after. Your dashboard is private to assigned team members.</p></section><p id="status" role="status">Loading your volunteer dashboard…</p><h2>My areas</h2><div id="areas" class="cards"></div><h2>Listings in my areas</h2><div id="listings" class="cards"></div><p>Listing editing is being prepared. For now this dashboard is read-only.</p></main><script>(async()=>{const status=document.getElementById('status'),areas=document.getElementById('areas'),listings=document.getElementById('listings');const node=(tag,text)=>{const e=document.createElement(tag);e.textContent=String(text??'');return e};try{const r=await fetch('/api/volunteer-dashboard.php',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error==='login_required'?'Please sign in to access your Volunteer Hub.':d.error==='volunteer_assignment_required'?'Your volunteer account has not been assigned an area yet.':d.error||'Unable to load dashboard');status.textContent=d.listings.length+' listings found across '+d.regions.length+' assigned area(s).';for(const region of d.regions){const c=node('article',region);c.className='card';areas.append(c)}for(const item of d.listings){const c=node('article','');c.className='card';const a=node('a',item.title);a.href='/activity.html?id='+encodeURIComponent(item.id);c.append(a,node('p',[item.town,item.region].filter(Boolean).join(' · ')));listings.append(c)}}catch(e){status.textContent=e.message}})();</script></body></html>
