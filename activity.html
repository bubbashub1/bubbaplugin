<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity · Bubba Hub</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">B</span><span><strong>Bubba</strong><small>HUB</small></span></a><nav class="main-nav"><a href="directory.html">Find activities</a><a href="planner.html">My planner</a><a href="my-hub.html">My Hub</a></nav><a class="button button-soft" href="account.html">My account</a></header><main class="app-shell"><div class="page-heading"><div><span class="eyebrow">Activity details</span><h1 id="title">Loading…</h1><p id="summary"></p></div><button class="button button-primary" id="save">♡ Save activity</button></div><section class="admin-panel"><div class="activity-image" style="height:230px;border-radius:16px">Activity image</div><h2 id="title2"></h2><p>Fun, local sessions for families and little ones.</p><h3>Sessions</h3><p id="session"></p><div class="hero-actions"><button class="button button-primary" id="planner">+ Add to planner</button><a class="button button-soft" href="directory.html">← Back to activities</a></div></section></main><footer class="site-footer"><strong>Bubba Hub</strong><span>Find · Plan · Book family activities</span></footer><script src="assets/js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const items=await bhActivities();const id=new URLSearchParams(location.search).get("id")||items[0].id;const a=bhActivity(id,items);document.title=a.title+" · Bubba Hub";document.getElementById("title").textContent=a.title;document.getElementById("title2").textContent=a.title;document.getElementById("summary").textContent=a.region+" · "+a.age_range.join(", ")+" · "+a.day;document.getElementById("session").textContent=a.day+" · "+a.time+" · "+a.duration+" · "+a.location;const save=document.getElementById("save"),plan=document.getElementById("planner");function refresh(){save.textContent=bhIsSaved(a.id)?"♥ Saved":"♡ Save activity";plan.textContent=bhIsPlanned(a.id)?"✓ In planner":"+ Add to planner"}save.onclick=()=>{bhToggleSaved(a.id);refresh()};plan.onclick=()=>{bhTogglePlanned(a.id);refresh()};refresh()})</script></body></html>
