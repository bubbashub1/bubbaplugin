<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity · Bubba Hub</title><link rel="stylesheet" href="assets/css/styles.css?v=20260925-activity2"></head><body><header class="site-header"><a class="brand" href="index.html" aria-label="Bubba Hub home"><img class="brand-logo" src="images/logos/mainlogo-20260924-221429-7e305d.jpg" alt="Bubba Hub"></a><nav class="main-nav"><a href="directory.html">Find activities</a><a href="planner.html">My planner</a><a href="calendar.html">Calendar</a><a href="my-hub.html">My Hub</a></nav><a class="button button-soft" href="account.html">My account</a></header><main class="app-shell"><div id="activityState" class="admin-panel"><p>Loading activity…</p></div></main><footer class="site-footer"><strong>Bubba Hub</strong><span>Find · Plan · Book family activities</span></footer><script src="assets/js/app.js?v=20260925-activity2"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const state=document.getElementById("activityState");try{const items=await bhActivities(),id=new URLSearchParams(location.search).get("id"),a=bhActivity(id,items);if(!a){state.innerHTML="<h2>Activity not found</h2><p>This activity may have been removed or the link is incorrect.</p><a class=\"button button-primary\" href=\"directory.html\">Find activities</a>";return}const venues=bhVenues(a),sessions=bhSessions(a);document.title=a.title+" · Bubba Hub";state.className="admin-panel";state.innerHTML='<div class="page-heading"><div><span class="eyebrow">Activity details</span><h1>'+bhEscape(a.title)+'</h1><p>'+bhEscape(a.region)+' · '+bhEscape((a.age_range||[]).join(", "))+' · '+venues.length+" "+(venues.length===1?"venue":"venues")+'</p></div><button class="button button-primary" id="save"></button></div><div class="activity-image" style="height:230px;border-radius:16px">Activity image</div><h2>'+bhEscape(a.title)+'</h2><p>Local family activity with '+venues.length+" "+(venues.length===1?"venue":"venues")+" and "+sessions.length+" scheduled "+(sessions.length===1?"session":"sessions")+'.</p><h3>Venues &amp; sessions</h3><div class="activity-grid">'+venues.map(v=>'<article class="feature-card"><h3>'+bhEscape(v.name||v.address||v.town||"Venue")+'</h3><p>'+bhEscape(v.address||v.town||v.region||"")+'</p>'+(v.sessions||[]).map(s=>'<p><strong>'+bhEscape(s.day||"")+'</strong> · '+bhEscape(s.time||"")+' · '+bhEscape(s.duration||"")+(s.price!==undefined&&s.price!==""?" · "+bhEscape(s.price):"")+'</p>').join("")+'</article>').join("")+'</div><div class="hero-actions"><button class="button button-primary" id="planner">+ Add to planner</button><a class="button button-soft" href="directory.html">← Back to activities</a></div>';const save=document.getElementById("save"),plan=document.getElementById("planner");function refresh(){save.textContent=bhIsSaved(a.id)?"♥ Saved":"♡ Save activity";plan.textContent=bhIsPlanned(a.id)?"✓ In planner":"+ Add to planner"}save.onclick=()=>{bhToggleSaved(a.id);refresh()};plan.onclick=()=>{bhTogglePlanned(a.id);refresh()};refresh()}catch(e){state.innerHTML="<h2>Activity unavailable</h2><p>We couldn't load this activity right now. Please try again.</p><a class=\"button button-primary\" href=\"directory.html\">Back to activities</a>"}})</script></body></html>
