<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity · Bubba Hub</title><link rel="stylesheet" href="assets/css/styles.css?v=20260925-activity1"></head><body><header class="site-header"><a class="brand" href="index.html" aria-label="Bubba Hub home"><img class="brand-logo" src="images/logos/mainlogo-20260924-221429-7e305d.jpg" alt="Bubba Hub"></a><nav class="main-nav"><a href="directory.html">Find activities</a><a href="planner.html">My planner</a><a href="my-hub.html">My Hub</a></nav><a class="button button-soft" href="account.html">My account</a></header><main class="app-shell"><div id="activityState" class="admin-panel"><p>Loading activity…</p></div></main><footer class="site-footer"><strong>Bubba Hub</strong><span>Find · Plan · Book family activities</span></footer><script src="assets/js/app.js?v=20260925-activity1"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const state=document.getElementById("activityState");try{const items=await bhActivities();const id=new URLSearchParams(location.search).get("id");const a=bhActivity(id,items);if(!a){state.innerHTML="<h2>Activity not found</h2><p>This activity may have been removed or the link is incorrect.</p><a class=\"button button-primary\" href=\"directory.html\">Find activities</a>";return}document.title=a.title+" · Bubba Hub";state.className="admin-panel";state.innerHTML='<div class="page-heading"><div><span class="eyebrow">Activity details</span><h1>'+bhEscape(a.title)+'</h1><p>'+bhEscape(a.region)+' · '+bhEscape((a.age_range||[]).join(", "))+' · '+bhEscape(a.day)+'</p></div><button class="button button-primary" id="save"></button></div><div class="activity-image" style="height:230px;border-radius:16px">Activity image</div><h2>'+bhEscape(a.title)+'</h2><p>Local family activity in '+bhEscape(a.location||a.town||"your area")+'.</p><h3>Sessions</h3><p>'+bhEscape(a.day)+' · '+bhEscape(a.time)+' · '+bhEscape(a.duration||"")+' · '+bhEscape(a.location||"")+'</p><div class="hero-actions"><button class="button button-primary" id="planner">+ Add to planner</button><a class="button button-soft" href="directory.html">← Back to activities</a></div>';const save=document.getElementById("save"),plan=document.getElementById("planner");function refresh(){save.textContent=bhIsSaved(a.id)?"♥ Saved":"♡ Save activity";plan.textContent=bhIsPlanned(a.id)?"✓ In planner":"+ Add to planner"}save.onclick=()=>{bhToggleSaved(a.id);refresh()};plan.onclick=()=>{bhTogglePlanned(a.id);refresh()};refresh()}catch(e){state.innerHTML="<h2>Activity unavailable</h2><p>We couldn't load this activity right now. Please try again.</p><a class=\"button button-primary\" href=\"directory.html\">Back to activities</a>"}})</script></body></html>
