<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity · Bubba Hub</title>
<link rel="stylesheet" href="assets/css/styles.css?v=20260925-listing1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head><body>
<header class="site-header"><a class="brand" href="index.html" aria-label="Bubba Hub home"><img class="brand-logo" src="images/logos/mainlogo-20260924-221429-7e305d.jpg" alt="Bubba Hub"></a><nav class="main-nav"><a href="directory.html">Find activities</a><a href="planner.html">My planner</a><a href="calendar.html">Calendar</a><a href="my-hub.html">My Hub</a></nav><a class="button button-soft" href="account.html">My account</a></header>
<main class="app-shell"><div id="activityState" class="listing-loading"><p>Loading activity…</p></div></main>
<footer class="site-footer"><strong>Bubba Hub</strong><span>Find · Plan · Book family activities</span><span>Devon &amp; Cornwall</span></footer>
<script src="assets/js/app.js?v=20260925-listing1"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
 const state=document.getElementById("activityState");
 try{
  const items=await bhActivities(),id=new URLSearchParams(location.search).get("id"),a=bhActivity(id,items);
  if(!a){state.innerHTML='<div class="admin-panel"><h2>Activity not found</h2><p>This activity may have been removed or the link is incorrect.</p><a class="button button-primary" href="directory.html">Find activities</a></div>';return}
  const venues=bhVenues(a),sessions=bhSessions(a),images=Array.isArray(a.gallery)&&a.gallery.length?a.gallery:(a.image_url?[a.image_url]:[]);
  document.title=a.title+" · Bubba Hub";
  const cats=Array.isArray(a.category)?a.category:[a.category].filter(Boolean),ages=Array.isArray(a.age_range)?a.age_range:[a.age_range].filter(Boolean);
  state.className="listing-page";
  state.innerHTML=
   '<section class="listing-hero">'+
    '<div class="listing-gallery">'+(images.length?images.map((src,i)=>'<img src="'+bhEscape(src)+'" alt="'+bhEscape(a.title)+'"'+(i?' loading="lazy"':'')+'>').join(""):'<div class="listing-gallery-placeholder">Bubba Hub activity</div>')+'</div>'+
    '<div class="listing-summary"><span class="eyebrow">'+bhEscape(cats.join(" · ")||"Family activity")+'</span><h1>'+bhEscape(a.title)+'</h1><p class="listing-intro">'+bhEscape(a.short_description||a.summary||"A local family activity listed on Bubba Hub.")+'</p>'+
    '<div class="listing-tags">'+ages.map(x=>'<span>'+bhEscape(x)+'</span>').join("")+(a.region?'<span>'+bhEscape(a.region)+'</span>':"")+'</div>'+
    '<div class="listing-actions"><button class="button button-primary" id="save"></button><button class="button button-soft" id="planner"></button></div></div>'+
   '</section>'+
   '<div class="listing-layout"><div class="listing-main">'+
    '<section class="listing-card"><span class="eyebrow">About</span><h2>About this activity</h2><div class="listing-description">'+bhEscape(a.description||a.content||"More information about this activity will appear here.")+'</div></section>'+
    '<section class="listing-card"><span class="eyebrow">When</span><h2>Schedule &amp; hours</h2><div class="schedule-list">'+venues.map(v=>'<article class="venue-schedule"><div><h3>'+bhEscape(v.name||"Venue")+'</h3><p>'+bhEscape(v.address||v.town||v.region||"")+'</p></div><div class="session-list">'+(v.sessions||[]).map(s=>'<div class="session-row"><strong>'+bhEscape(s.day||"Session")+'</strong><span>'+bhEscape(s.start||s.time||"")+((s.end||s.end_time)?" – "+bhEscape(s.end||s.end_time):"")+'</span><span>'+bhEscape(s.duration||"")+'</span><span>'+((s.price!==undefined&&s.price!=="")?bhEscape(String(s.price).startsWith("£")?s.price:"£"+s.price):"")+'</span></div>').join("")+'</div></article>').join("")+'</div></section>'+
    '<section class="listing-card"><span class="eyebrow">Where</span><h2>Venues</h2><div class="venue-list">'+venues.map(v=>'<article class="venue-card"><div><h3>'+bhEscape(v.name||"Venue")+'</h3><p>'+bhEscape(v.address||"")+(v.postcode?" · "+bhEscape(v.postcode):"")+'</p><p>'+bhEscape(v.town||"")+(v.region?" · "+bhEscape(v.region):"")+'</p></div><a class="button button-soft" target="_blank" rel="noopener" href="'+(v.lat&&v.long?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(v.lat+","+v.long):"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(v.address||v.town||v.name||""))+'">Directions</a></article>').join("")+'</div><div id="listingMap" class="listing-map" aria-label="Activity venue map"></div></section>'+
   '</div><aside class="listing-side">'+
    '<section class="listing-card organiser-card"><span class="eyebrow">Organiser</span><div class="organiser-profile"><div class="organiser-avatar">'+(a.organiser_avatar?'<img src="'+bhEscape(a.organiser_avatar)+'" alt="'+bhEscape(a.organiser_name||"Organiser")+'">':'<span>BH</span>')+'</div><div><h2>'+bhEscape(a.organiser_name||a.organiser||"Activity organiser")+'</h2></div></div><div class="organiser-links"><a class="button button-soft organiser-icon-link" href="organiser.html?id='+encodeURIComponent(a.organiser_id||a.organiser_slug||a.organiser_name||"")+'">🏪 <span>View organiser</span></a>'+(a.organiser_website?'<a class="organiser-icon-link" title="Business website" aria-label="Business website" target="_blank" rel="noopener" href="'+bhEscape(a.organiser_website)+'">🌐</a>':"")+(a.email?'<a class="organiser-icon-link" title="Email organiser" aria-label="Email organiser" href="mailto:'+bhEscape(a.email)+'">✉</a>':"")+(a.organiser_socials?.facebook?'<a class="organiser-icon-link" title="Facebook" aria-label="Facebook" target="_blank" rel="noopener" href="'+bhEscape(a.organiser_socials.facebook)+'">f</a>':"")+(a.organiser_socials?.instagram?'<a class="organiser-icon-link" title="Instagram" aria-label="Instagram" target="_blank" rel="noopener" href="'+bhEscape(a.organiser_socials.instagram)+'">◎</a>':"")+(a.organiser_socials?.tiktok?'<a class="organiser-icon-link" title="TikTok" aria-label="TikTok" target="_blank" rel="noopener" href="'+bhEscape(a.organiser_socials.tiktok)+'">♪</a>':"")+(a.organiser_socials?.youtube?'<a class="organiser-icon-link" title="YouTube" aria-label="YouTube" target="_blank" rel="noopener" href="'+bhEscape(a.organiser_socials.youtube)+'">▶</a>':"")+'</div></section>'+<section class="listing-card booking-card"><span class="eyebrow">Join in</span><h2>Book or reserve</h2><p>Check availability or book directly with the organiser.</p>'+(a.booking_url?'<a class="button button-primary button-full" target="_blank" rel="noopener" href="'+bhEscape(a.booking_url)+'">Book / reserve</a>': '<p class="muted">Booking link coming soon.</p>')+'</section>'+
    '<section class="listing-card"><span class="eyebrow">Contact</span><h2>Contact organiser</h2><p>Have a question about the activity, venue or sessions?</p>'+(a.email?'<a class="button button-soft button-full" href="mailto:'+bhEscape(a.email)+'">Contact organiser</a>':'<a class="button button-soft button-full" href="mailto:">Contact organiser</a>')+'</section>'+
    '<section class="listing-card"><span class="eyebrow">Good to know</span><div class="good-to-know">'+(a.price?'<p><strong>Price</strong><br>'+bhEscape(a.price)+'</p>':"")+(ages.length?'<p><strong>Age range</strong><br>'+bhEscape(ages.join(", "))+'</p>':"")+(a.term_time?'<p><strong>Term time</strong><br>'+bhEscape(a.term_time)+'</p>':"")+'</div></section>'+
   '</aside></div>'+
   '<div class="listing-bottom"><a class="button button-soft" href="directory.html">← Back to activities</a></div>';
  const save=document.getElementById("save"),plan=document.getElementById("planner");
  function refresh(){save.textContent=bhIsSaved(a.id)?"♥ Saved":"♡ Save activity";plan.textContent=bhIsPlanned(a.id)?"✓ In planner":"+ Add to planner"}
  save.onclick=()=>{bhToggleSaved(a.id);refresh()};plan.onclick=()=>{bhTogglePlanned(a.id);refresh()};refresh();
  if(window.L){const points=venues.filter(v=>v.lat&&v.long);if(points.length){const map=L.map("listingMap").setView([Number(points[0].lat),Number(points[0].long)],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(map);points.forEach(v=>L.marker([Number(v.lat),Number(v.long)]).addTo(map).bindPopup("<strong>"+bhEscape(v.name||"Venue")+"</strong><br>"+bhEscape(v.address||v.town||"")));if(points.length>1){const group=L.featureGroup(points.map(v=>L.marker([Number(v.lat),Number(v.long)])));map.fitBounds(group.getBounds().pad(.2));}}else document.getElementById("listingMap").innerHTML="<div class='map-empty'>Venue map will appear when a location is added.</div>";}
 }catch(e){state.innerHTML='<div class="admin-panel"><h2>Activity unavailable</h2><p>We couldn’t load this activity right now.</p><a class="button button-primary" href="directory.html">Back to activities</a></div>'}
});
</script></body></html>
