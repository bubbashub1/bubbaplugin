<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 123 — Bubba Hub</title>
  <link rel="stylesheet" href="assets/css/activity.css">
</head>
<body>

  <!-- MASTER HEADER -->
  <header class="bh-site-header">
    <div class="bh-header-inner">
      
      <!-- Top Row: Logo, Nav, Search Icon & Sign In -->
      <div class="bh-header-top-row">
        <a href="#" class="bh-header-logo">
          <img src="images/logos/gemini_generated_image_pq5i56pq5i56pq5i-removebg-preview-20260930-190428-b9e652.png" alt="Bubba Hub Logo">
        </a>

        <nav class="bh-main-nav" id="bh-main-nav">
          <a href="#">Find activities</a>
          <a href="#">My Hub</a>
          <a href="#">Support & Guidance</a>
          <a href="#">Class Leaders</a>
          <a href="#">My Account</a>
        </nav>

        <div class="bh-header-actions">
          <!-- Search Toggle Button -->
          <button class="bh-header-search-toggle" id="searchToggleBtn" aria-label="Toggle Search">
            🔍
          </button>

          <a href="#" class="bh-sign-in-btn">Sign in</a>
        </div>
      </div>

      <!-- Bottom Row: Expandable Search Drawer (Hidden by default) -->
      <form action="activities.php" method="GET" class="bh-header-search-bar" id="searchBarForm">
        <div class="bh-header-search-fields">
          <input type="text" name="keyword" placeholder="Keyword">
          <select name="region">
            <option value="">Region</option>
          </select>
          <select name="town">
            <option value="">Town</option>
          </select>
          <select name="category">
            <option value="">Category</option>
          </select>
          <select name="day">
            <option value="">Day</option>
          </select>
          <button type="submit" class="bh-header-search-submit">Search</button>
        </div>
      </form>

    </div>
  </header>

  <!-- JavaScript for Expandable Search Drawer -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const searchToggle = document.getElementById('searchToggleBtn');
      const searchBar = document.getElementById('searchBarForm');

      if (searchToggle && searchBar) {
        searchToggle.addEventListener('click', function(e) {
          e.preventDefault();
          searchBar.classList.toggle('is-open');
          if (searchBar.classList.contains('is-open')) {
            const keywordInput = searchBar.querySelector('input[name="keyword"]');
            if (keywordInput) keywordInput.focus();
          }
        });
      }
    });
  </script>

</body>
</html>
