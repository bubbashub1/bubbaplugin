<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer with Bubba Hub</title><meta name="description" content="Apply to volunteer with Bubba Hub in Devon and Cornwall."><link rel="stylesheet" href="/assets/css/styles.css"><style>.volunteer-wrap{max-width:760px;margin:40px auto 80px;padding:20px;font-family:Quicksand,Arial,sans-serif}.volunteer-hero{background:#e7f5e9;padding:30px;border-radius:24px}.volunteer-form{display:grid;gap:15px;margin-top:24px}.volunteer-form label{display:grid;gap:6px;font-weight:700}.volunteer-form input,.volunteer-form select,.volunteer-form textarea{padding:13px;border:1px solid #a8c4b3;border-radius:12px;width:100%;box-sizing:border-box;font:inherit}.volunteer-form .check{display:flex;gap:10px;align-items:flex-start}.volunteer-form .check input{width:auto;margin-top:6px}.volunteer-form button{border:0;background:#17684f;color:white;padding:15px;border-radius:20px;font-weight:800;cursor:pointer}.volunteer-form button:disabled{opacity:.6}.honeypot{position:absolute;left:-10000px}</style></head><body><header class="site-header"><a class="brand" href="/"><img class="brand-logo" src="/wp-content/uploads/logo/logoheader.png" alt="Bubba Hub"></a><nav class="main-nav"><a href="/directory.html">Find activities</a><a href="/team">Meet the Team</a></nav></header><main class="volunteer-wrap"><section class="volunteer-hero"><h1>Volunteer with Bubba Hub 💚</h1><p>Help local families discover activities, classes and events across Devon and Cornwall. Tell us a little about yourself and how you'd like to help.</p></section><form class="volunteer-form" id="volunteerForm"><label>Your name *<input name="name" maxlength="160" autocomplete="name" required></label><label>Email address *<input name="email" type="email" maxlength="190" autocomplete="email" required></label><label>Your town<input name="town" maxlength="120" autocomplete="address-level2"></label><label>Area you'd like to support<input name="region" maxlength="120" placeholder="e.g. Torbay, Exeter, South Hams"></label><label>How would you like to help? *<select name="role" required><option value="">Please choose</option><option>Area coordinator</option><option>Listings and database</option><option>Events</option><option>Marketing and social media</option><option>General support</option></select></label><label>Availability<textarea name="availability" maxlength="500" rows="2" placeholder="e.g. A couple of hours each week"></textarea></label><label>Why would you like to volunteer?<textarea name="motivation" maxlength="2000" rows="4"></textarea></label><label class="check"><input type="checkbox" name="consent" required><span>I agree that Bubba Hub may use my details to review and contact me about this volunteer application. My application does not automatically create an account or grant access.</span></label><label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit">Send application</button><p id="applicationStatus" role="status" aria-live="polite"></p></form></main><script>document.getElementById('volunteerForm').addEventListener('submit',async function(e){e.preventDefault();const f=e.currentTarget,button=f.querySelector('button'),status=document.getElementById('applicationStatus');button.disabled=true;status.textContent='Sending your application…';const data=Object.fromEntries(new FormData(f));data.consent=!!f.elements.consent.checked;try{const response=await fetch('/api/volunteer-apply.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok||!result.ok)throw Error('Please check your details and try again.');status.textContent='Thank you! Your application has been received.';f.reset()}catch(err){status.textContent=err.message}finally{button.disabled=false}});</script></body></html>
