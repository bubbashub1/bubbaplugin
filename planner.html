<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Planner · Bubba Hub</title><link rel="stylesheet" href="assets/css/styles.css?v=20260924-2300"></head><body><header class="site-header"><a class="brand" href="index.html" aria-label="Bubba Hub home"><img class="brand-logo" src="images/logos/mainlogo-20260924-221429-7e305d.jpg" alt="Bubba Hub"></a><nav class="main-nav"><a href="directory.html">Find activities</a><a class="active" href="planner.html">My planner</a><a href="my-hub.html">My Hub</a></nav><a class="button button-soft" href="account.html">My account</a></header><main class="app-shell"><div class="page-heading"><div><span class="eyebrow">Your week</span><h1>My Planner</h1><p>Plan the activities you actually want to do.</p></div><a class="button button-primary" href="directory.html">+ Add activity</a></div><section class="admin-panel"><div class="admin-panel-head"><div><span class="eyebrow">Week view</span><h2>This week</h2></div><span class="status" id="count">0 planned</span></div><div class="activity-grid" id="results"></div></section></main><footer class="site-footer"><strong>Bubba Hub</strong><span>Find · Plan · Book family activities</span></footer><script src="assets/js/app.js?v=20260924-2300"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const items=await bhActivities(),results=document.getElementById("results"),count=document.getElementById("count");function render(){const ids=bhGet(BH_KEYS.planner),list=items.filter(x=>ids.includes(x.id));count.textContent=list.length+" planned";results.innerHTML=list.map(x=>'<article class="feature-card"><span class="eyebrow">'+x.day+" · "+x.time+'</span><h3>'+x.title+'</h3><p>'+x.location+" · "+x.age_range.join(", ")+'</p><button class="button button-soft remove" data-id="'+x.id+'">Remove</button></article>').join("")||'<div class="admin-panel"><h3>Your planner is empty</h3><p>Find an activity and choose Add to planner.</p><a class="button button-primary" href="directory.html">Find activities</a></div>';document.querySelectorAll(".remove").forEach(b=>b.onclick=()=>{bhTogglePlanned(b.dataset.id);render()})}render()})</script></body></html>
