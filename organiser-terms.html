<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terms &amp; Conditions · Bubba Hub</title><link rel="stylesheet" href="/assets/css/styles.css?v=20260928-shell2"><link rel="stylesheet" href="/assets/css/organiser.css?v=20261001-storefront2"></head><body><header class="site-header"><a class="brand" href="index.html" aria-label="Bubba Hub home"><img class="brand-logo" src="/images/logos/gemini_generated_image_t65ztnt65ztnt65z-20260930-185704-7e0755.jpeg" alt="Bubba Hub"></a><nav class="main-nav" aria-label="Main navigation"><a href="directory.html">Find activities</a><a href="my-hub.html">My Hub</a><a href="help-support.html">Support &amp; Guidance</a><a href="leader.html">Class Leaders</a><a href="account.html">Account</a></nav><a class="button button-soft" href="account.html">My account</a></header><main class="app-shell organiser-storefront-page"><section id="termsState" class="organiser-empty"><span class="eyebrow">Organiser Terms &amp; Conditions</span><h1>Loading Terms &amp; Conditions…</h1><p>Please wait.</p></section></main><footer class="site-footer"><div class="site-footer-bottom"><span>&copy; 2026 Bubba Hub</span><span>Devon &amp; Cornwall</span></div></footer><script>
document.addEventListener("DOMContentLoaded",async()=>{
 const state=document.getElementById("termsState"),slug=location.pathname.split("/").filter(Boolean).pop().replace(/terms\.html$/i,"");
 try{
  const r=await fetch("/api/organiser-terms.php?slug="+encodeURIComponent(slug),{cache:"no-store",headers:{Accept:"application/json"}});
  const data=await r.json();
  if(!r.ok||!data.ok)throw new Error("Terms not found");
  const name=String(data.organisation_name||"Organiser");
  document.title=name+" · Terms & Conditions · Bubba Hub";
  const text=String(data.terms_content||"").trim();
  state.className="organiser-faq";
  state.innerHTML='<div class="storefront-heading"><span class="eyebrow">Organiser Terms &amp; Conditions</span><h1>'+bhEscape(name)+'</h1><p>Booking and participation terms provided by the organiser.</p></div><div class="organiser-terms-content">'+(text?bhEscape(text).replace(/\n/g,"<br>"):"<p>The organiser has not added custom Terms &amp; Conditions yet.</p>")+'</div><div class="organiser-back"><a class="button button-soft" href="organiser/'+encodeURIComponent(slug)+'/">← Back to organiser</a></div>';
 }catch(e){state.innerHTML='<section class="organiser-empty"><h1>Terms &amp; Conditions unavailable</h1><p>We couldn’t load this organiser’s Terms &amp; Conditions.</p><a class="button button-primary" href="directory.html">Back to activities</a></section>'}
});
</script><script src="/assets/js/app.js"></script></body></html>
